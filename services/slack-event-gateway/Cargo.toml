[package]
name = "slack-event-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tomoya-k31/totsuka"
description = "Receives Slack Events API deliveries, projects them to coordinates, and publishes to Pub/Sub. Never stores, forwards or logs the message body."
publish = false

[lints.rust]
warnings = "deny"
missing_docs = "warn"

[[bin]]
name = "slack-event-gateway"
path = "src/main.rs"

# The dependency list is short on purpose. This process is deployed by
# operators into their own cloud project and handles every Slack message the
# operator can see; every crate here is attack surface they inherit, and the
# container is distroless, so there is nothing to patch a CVE in but this
# lockfile.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
# `server-graceful` is what lets a SIGTERM finish the deliveries already in
# flight instead of dropping them; see the shutdown block in `main.rs`.
hyper-util = { version = "0.1", features = ["tokio", "server-graceful"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HMAC-SHA256 over the raw body, per Slack's signing scheme.
hmac = "0.12"
sha2 = "0.10"
# Constant-time comparison. Hand-rolling this is exactly the thing not to
# hand-roll: a `==` on the digest leaks it one byte at a time.
subtle = "2"
# Pub/Sub publish and the metadata-server token. rustls rather than the
# platform TLS stack, because a distroless image has no platform stack.
#
# **Roots compiled in, not read from the filesystem.** `native-roots` would
# make TLS depend on the base image shipping `ca-certificates` — and swapping
# the base for `scratch` would then break every publish at runtime with a TLS
# error rather than at build time. Compiling the roots in removes that coupling
# entirely; the cost is that updating them is a dependency bump, which is
# exactly how the rest of this lockfile is maintained anyway.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
percent-encoding = "2"
thiserror = "2"

# Symbols are stripped by cargo rather than by a `strip` invocation in the
# Dockerfile: `binutils` is not in the builder image, and a missing `strip`
# would fail the release build at the last step.
#
# `panic` stays at the default `unwind`. With `abort`, a panic anywhere takes
# the whole process down — every delivery in flight with it — instead of ending
# one connection. For a service whose failures are counted by Slack and used to
# disable the subscription, that is the wrong trade.
[profile.release]
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
percent-encoding = "2"
