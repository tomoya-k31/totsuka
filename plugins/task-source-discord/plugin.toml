name = "discord"
kind = "task_source"
version = "0.1.0"
# `InitializeParams.workflows` (0.6.0, #554) is where the channel watch
# triggers arrive, and this plugin has no other way to learn what to watch —
# an older orchestrator would start it with nothing to do. The F-54 gate turns
# that into a refused launch instead.
# The upper bound moved to `<0.8` for #626 (`WorkflowInfo.projects`). The
# floor did not: this plugin serves a single domain, so filtering by project
# name is the identity and ignoring the new field costs nothing. Requiring
# 0.7.0 here would strand orchestrators it works with — the same reason orca's
# floor differed from herdr's for #411.
protocol_version = ">=0.6.0, <0.8"

[capabilities]
outputs = ["source"]
