[package]
name = "agent-ide-herdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "totsuka agent_ide plugin for herdr (stdio JSON-RPC ↔ herdr Socket API adapter)."
# Internal binary crate — depends on plugin-protocol by path, so it must be
# non-publishable for cargo-deny to permit the path dependency.
publish = false

[lints]
workspace = true

# The bin name must equal `plugin.toml`'s `name` — see the note in
# plugins/task-source-github/Cargo.toml. Enforced by `scripts/arch-lint.sh`.
# This shadows the external `herdr` CLI inside `target/{profile}/`; harmless
# here because the plugin reaches herdr over its Unix socket and never spawns
# it, but see plugins/agent-ide-orca/Cargo.toml for the case that does.
[[bin]]
name = "herdr"
path = "src/main.rs"

[dependencies]
plugin-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = { workspace = true, features = ["serde"] }
# `net` (Unix socket to herdr) + `io-std` (stdin/stdout) on top of the workspace
# tokio feature set.
tokio = { workspace = true, features = ["net", "io-std"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Only to derive a collision-free `agent.start` name from a task id (ADR-0032
# D-2). Already in the workspace for `plugin install`'s SHA-256 verification, so
# this adds no new crate to the graph.
sha2.workspace = true

[dev-dependencies]
# `test-util` is what makes `#[tokio::test(start_paused = true)]` available:
# the integration test for the never-clears `agent_not_ready` path has to wait
# out PROMPT_READY_WINDOW, and on a paused clock that costs no wall time.
tokio = { workspace = true, features = ["net", "io-std", "test-util"] }
