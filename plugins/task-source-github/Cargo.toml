[package]
name = "task-source-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "totsuka task_source plugin for GitHub Issues / Projects (stdio JSON-RPC server)."
# Internal binary crate — depends on plugin-protocol by path, so it must be
# non-publishable for cargo-deny to permit the path dependency.
publish = false

[lints]
workspace = true

# The bin name must equal `plugin.toml`'s `name`: that is the filename
# `plugin install` requires inside the source directory, and the one the store
# lays down as `<plugin dir>/<name>`. Keeping them equal makes
# `target/{profile}/<name>` directly installable and distributable, with no
# rename step. `scripts/arch-lint.sh` enforces the invariant.
[[bin]]
name = "github"
path = "src/main.rs"

[dependencies]
plugin-protocol.workspace = true
plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = { workspace = true, features = ["serde"] }
reqwest.workspace = true
# `io-std` (stdin/stdout) is on top of the workspace tokio feature set.
tokio = { workspace = true, features = ["io-std"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
