# Slack App Manifest for the totsuka task-source-slack plugin —
# **Socket Mode variant**, `event_source = "socket"` (the default).
#
# Paste this into https://api.slack.com/apps > "Create New App" >
# "From a manifest" (YAML), then install the app to your workspace.
#
# THERE IS A SECOND MANIFEST. `manifest.gateway.yml` is the Request URL
# variant used with an Event Gateway (ADR-0072, #652). Socket Mode and Request
# URLs are mutually exclusive per Slack app, so pick before you create it —
# switching later means redoing the app from the other manifest. The trade-off,
# in one line each: Socket Mode needs nothing deployed but LOSES every event
# that arrives while totsuka is stopped (and a long enough outage makes Slack
# disable the subscription); the gateway costs a GCP project and about $1/month
# and loses nothing. The comments at the top of `manifest.gateway.yml` have the
# longer version.
#
# The app acts as *you* for everything visible in a conversation: mention
# detection, the approved reply, and the self-DM draft record all use the
# user token. The bot user exists for exactly ONE thing — DM-ing you a
# notification nudge when a draft/picker arrives (#305), because ephemerals
# and your own self-DM posts generate no Slack notification. It never posts
# a reply.
# After installing, put three tokens in your secret store and reference them
# from the `[slack]` table of `~/.config/totsuka/config.toml` (per-plugin
# `plugins/*.toml` files are gone — plugin settings live in config.toml now):
#   - User OAuth Token (`xoxp-…`)      — OAuth & Permissions page
#   - Bot User OAuth Token (`xoxb-…`)  — same page (optional: omit
#     `bot_token` from `[slack]` to run without nudges)
#   - App-Level Token  (`xapp-…`)      — Basic Information > App-Level Tokens;
#     create one with scope `connections:write` (Socket Mode)
#
# If you ever change the scopes below, Slack requires you to RE-INSTALL the
# app; the re-install issues a NEW `xoxp-` token AND a NEW `xoxb-` token, so
# update BOTH Keychain entries (`totsuka doctor` will tell you when a stored
# token went bad).
#
# UPGRADING FROM A PRE-#658 INSTALL: `usergroups:read` was added to the user
# scopes below. Until you re-apply this manifest and reinstall, mentions of a
# GROUP you belong to (`@team-name`) will not become tasks — personal mentions
# are unaffected. totsuka warns about this at startup rather than failing, so
# nothing breaks if you put it off.
display_information:
  name: totsuka reply assistant
  description: Turns mentions of you into totsuka tasks and posts approved replies under your own name.
  background_color: "#1a2b3c"
features:
  bot_user:
    display_name: totsuka reply assistant
    always_online: true
oauth_config:
  scopes:
    # Bot scopes: the notification nudge DM only (#305).
    bot:
      - chat:write # post the nudge into the bot<->operator DM
      - im:write # open that DM (conversations.open)
    # User scopes: everything conversation-visible is done as the operator.
    user:
      - channels:history # read public-channel messages (mention detection / thread context)
      - channels:read # resolve channel names (conversations.info) for [[channel_groups]] prefix rules
      - groups:history # read private-channel messages
      - groups:read # resolve private-channel names for [[channel_groups]] prefix rules
      - users:read # resolve display names for task context
      - chat:write # post the approved reply / draft records as you
      - im:write # open your self-DM to record drafts
      - reactions:read # receive reaction_added for the :eyes: task trigger (#319)
      # Group mentions (#658): which user groups you belong to is resolved at
      # startup via `usergroups.list`. Without this scope personal mentions
      # still work and group ones silently do not, so totsuka warns at startup.
      - usergroups:read
settings:
  event_subscriptions:
    # user_events (not bot_events): delivered over Socket Mode for the
    # channels the *user* is a member of. Deliberately NO `message.im`:
    # bot-DM nudges must never re-enter the mention pipeline.
    user_events:
      - message.channels
      - message.groups
      # #319: reactions the *operator* adds start a task like a mention does.
      # `reaction_removed` is deliberately NOT subscribed to — removing a
      # reaction is not a cancel signal, and not subscribing is clearer than
      # receiving the event and dropping it.
      - reaction_added
  interactivity:
    # Approve/reject buttons (block_actions) arrive over Socket Mode.
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  # Long-lived tokens by design: rotation would require a refresh-token dance
  # the plugin deliberately avoids (tokens live in the macOS Keychain).
  token_rotation_enabled: false
