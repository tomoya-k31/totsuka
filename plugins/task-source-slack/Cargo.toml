[package]
name = "task-source-slack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "totsuka task_source plugin for Slack mention-reply assistance (stdio JSON-RPC server)."
# Internal binary crate — depends on plugin-protocol by path, so it must be
# non-publishable for cargo-deny to permit the path dependency.
publish = false

[lints]
workspace = true

[[bin]]
name = "task-source-slack"
path = "src/main.rs"

[dependencies]
plugin-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = { workspace = true, features = ["serde"] }
reqwest.workspace = true
# `io-std` (stdin/stdout) is on top of the workspace tokio feature set.
tokio = { workspace = true, features = ["io-std"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
