[package]
name = "task-source-notion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "totsuka task_source plugin for Notion databases (stdio JSON-RPC server)."
# Internal binary crate — depends on plugin-protocol by path, so it must be
# non-publishable for cargo-deny to permit the path dependency.
publish = false

[lints]
workspace = true

# The bin name must equal `plugin.toml`'s `name` — see the note in
# plugins/task-source-github/Cargo.toml. Enforced by `scripts/arch-lint.sh`.
[[bin]]
name = "notion"
path = "src/main.rs"

[dependencies]
plugin-protocol.workspace = true
plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = { workspace = true, features = ["serde"] }
reqwest.workspace = true
# `io-std` (stdin/stdout) is on top of the workspace tokio feature set.
tokio = { workspace = true, features = ["io-std"] }
thiserror.workspace = true
# Parses the embedded `src/defaults.toml` (instruction defaults, #398). The live
# config still arrives as JSON via `initialize`; this is only for the built-in
# fallbacks baked into the binary.
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
