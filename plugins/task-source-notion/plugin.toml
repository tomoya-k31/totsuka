name = "notion"
kind = "task_source"
version = "0.2.0"
# 0.1.6 introduced `task/submit` (push ingestion), which carried this plugin
# across the 0.2.0 `tasks/fetch` removal (ADR-0008) and the 0.3.0 removal of
# `Task.thread_key` (#242/#264); `<0.6` carries it across the 0.4.0 removal of
# `TaskDispatchParams.hook` and `Capabilities.design_preview` (#411), neither
# of which a task_source ever touched.
protocol_version = ">=0.1.6, <0.6"

[capabilities]
outputs = ["source"]
