name = "notion"
kind = "task_source"
version = "0.3.0"
# 0.6.0 renamed `InitializeParams.triggers` to `workflows` (#554). A plugin
# built against the old name reads no field and reports zero workflows —
# it starts, runs, and watches nothing — so the floor moved to `>=0.6.0`
# and the F-54 gate turns that silent failure into a refused launch.
protocol_version = ">=0.6.0, <0.7"

# No `[capabilities] outputs`: the deliverable is the agent's to write
# itself, so this plugin publishes nothing.
