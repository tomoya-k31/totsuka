name = "macos"
kind = "notifier"
version = "0.1.0"
protocol_version = ">=0.6.0, <0.8"

# A notifier declares no feature capabilities; it only receives `notify`.
[capabilities]
# ADR-0113: answers `config/schema` before `initialize` (protocol 0.7.7), so
# the menu bar app's settings window can render this table as a form.
config_schema = true
