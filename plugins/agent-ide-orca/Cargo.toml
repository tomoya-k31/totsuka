[package]
name = "agent-ide-orca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "totsuka agent_ide plugin for orca (stdio JSON-RPC ↔ orca CLI adapter)."
# Internal binary crate — depends on plugin-protocol by path, so it must be
# non-publishable for cargo-deny to permit the path dependency.
publish = false

[lints]
workspace = true

# The bin name must equal `plugin.toml`'s `name` — see the note in
# plugins/task-source-github/Cargo.toml. Enforced by `scripts/arch-lint.sh`.
# Caveat: this plugin spawns the external `orca` CLI by PATH lookup
# (`orca_bin`, default `orca`), and `target/{profile}/orca` now has the same
# name. Adding the target dir to PATH would make it invoke itself — override
# `orca_bin` with an absolute path if you ever do that.
[[bin]]
name = "orca"
path = "src/main.rs"

[dependencies]
plugin-protocol.workspace = true
# For `runtime::init_tracing` only — the one place that knows how a
# plugin's stderr logging must be set up (RUST_LOG honoured, ANSI off
# when the host is capturing the pipe).
plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = { workspace = true, features = ["serde"] }
# `io-std` (stdin/stdout) on top of the workspace tokio feature set (which
# already includes `process` for spawning the orca CLI).
tokio = { workspace = true, features = ["io-std"] }
thiserror.workspace = true
# `O_NONBLOCK` / `ENXIO` for the launch env FIFO's writer (#744, `handoff`) —
# constants only, no `unsafe`.
libc.workspace = true
tracing.workspace = true

[dev-dependencies]
plugin-conformance.workspace = true
# `test-util` makes `#[tokio::test(start_paused = true)]` available: the
# dispatch path that waits out AGENT_DETECT_WAIT for an agent orca never
# recognises costs no wall time on a paused clock (as in agent-ide-herdr).
tokio = { workspace = true, features = ["test-util"] }
