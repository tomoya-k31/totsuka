[package]
name = "agent-ide-orca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "totsuka agent_ide plugin for orca (stdio JSON-RPC ↔ orca CLI adapter)."
# Internal binary crate — depends on plugin-protocol by path, so it must be
# non-publishable for cargo-deny to permit the path dependency.
publish = false

[lints]
workspace = true

# The bin name must equal `plugin.toml`'s `name` — see the note in
# plugins/task-source-github/Cargo.toml. Enforced by `scripts/arch-lint.sh`.
# Caveat: this plugin spawns the external `orca` CLI by PATH lookup
# (`orca_bin`, default `orca`), and `target/{profile}/orca` now has the same
# name. Adding the target dir to PATH would make it invoke itself — override
# `orca_bin` with an absolute path if you ever do that.
[[bin]]
name = "orca"
path = "src/main.rs"

[dependencies]
plugin-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = { workspace = true, features = ["serde"] }
# `io-std` (stdin/stdout) on top of the workspace tokio feature set (which
# already includes `process` for spawning the orca CLI).
tokio = { workspace = true, features = ["io-std"] }
thiserror.workspace = true
# Parses the embedded `src/defaults.toml` (prompt defaults, #317). The plugin
# still receives its live config as JSON via `initialize`; this is only for the
# built-in fallbacks baked into the binary.
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
