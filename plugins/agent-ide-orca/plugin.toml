name = "orca"
kind = "agent_ide"
version = "0.1.0"
# This used to stay at `>=0.1.0` while herdr sat at `>=0.2.3`: orca drives the
# `orca` CLI itself and never reads `TaskDispatchParams.tool_launch`, so #411's
# floor would have excluded orchestrators it works with perfectly well. #554 is
# a different case — 0.6.0 renamed `InitializeParams.triggers` to `workflows`,
# and every plugin of every kind reads `initialize`. The floors match now
# because the dependency does, not because agent_ide plugins move together.
protocol_version = ">=0.6.0, <0.7"

# orca has no structured plan API and no pane-control surface, so only the
# capabilities it can honestly fulfil are declared (F-33). pane_control is
# intentionally omitted.
[capabilities]
state_stream = true
