[workspace]
resolver = "3"
members = [
    "crates/orchestrator-core",
    "crates/orchestrator-cli",
    "crates/plugin-protocol",
    "crates/test-support",
    "plugins/task-source-github",
    "plugins/task-source-notion",
    "plugins/agent-ide-herdr",
    "plugins/agent-ide-orca",
    "plugins/notifier-macos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88 is required transitively by the security-patched `time` 0.3.47
# (RUSTSEC-2026-0009 fix).
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tomoya-k31/totsuka"

# Common dependencies are declared here and inherited by each crate with
# `<dep>.workspace = true`. Feature/version bumps happen in one place.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"
libc = "0.2"
keyring = { version = "3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
regex = "1"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
plugin-protocol = { path = "crates/plugin-protocol" }
test-support = { path = "crates/test-support" }
sha2 = "0.10"
toml_edit = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }

# Deny warnings across the whole workspace. Each crate opts in with
# `[lints] workspace = true`.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
warnings = "deny"
