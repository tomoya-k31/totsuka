[workspace]
resolver = "3"
members = [
    "crates/orchestrator-core",
    "crates/orchestrator-cli",
    "crates/plugin-protocol",
    "crates/plugin-sdk",
    "crates/test-support",
    "plugins/task-source-github",
    "plugins/task-source-notion",
    "plugins/task-source-slack",
    "plugins/agent-ide-herdr",
    "plugins/agent-ide-orca",
    "plugins/notifier-macos",
]

[workspace.package]
version = "0.6.3" # x-release-please-version
edition = "2024"
# 1.88 is required transitively by the security-patched `time` 0.3.47
# (RUSTSEC-2026-0009 fix).
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tomoya-k31/totsuka"

# Common dependencies are declared here and inherited by each crate with
# `<dep>.workspace = true`. Feature/version bumps happen in one place.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"
libc = "0.2"
keyring = { version = "3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
regex = "1"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "signal"] }
plugin-protocol = { path = "crates/plugin-protocol" }
plugin-sdk = { path = "crates/plugin-sdk" }
test-support = { path = "crates/test-support" }
# Dev-only, for orchestrator-cli: the setup wizard generates `plugins/<name>.toml`
# and its test asserts the plugins' own deserializers accept it.
task-source-github = { path = "plugins/task-source-github" }
task-source-slack = { path = "plugins/task-source-slack" }
sha2 = "0.10"
toml_edit = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
# TLS matches reqwest's `default-tls` (native-tls) so both HTTP and WebSocket
# go through the platform TLS stack.
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Build-time tuning for a workspace whose `cargo test` links ~50 binaries
# (24 integration-test targets + 8 bins + a unit-test binary per lib and per
# bin). Only *debuginfo* is dialled down; opt-level, debug-assertions and
# overflow-checks keep their dev defaults for our own code, so the tests catch
# exactly what they caught before.
[profile.dev]
# Line tables only: `panic!` / `assert!` backtraces still name function, file
# and line — the entirety of what a failing test report shows. What is lost is
# stepping in a debugger with full variable/type info; get it back for a
# session with `cargo build --config 'profile.dev.debug=2'`.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are not what the tests are debugging, and this graph's heaviest
# debuginfo producers are third-party (`rusqlite`'s bundled SQLite
# amalgamation, `reqwest`/native-tls, `tokio`).
#
# Deliberately *only* debuginfo: `opt-level = 1` on dependencies was measured
# and rejected (#281). Cold `cargo build --workspace --all-targets`, this
# workspace, warm rebuild = touch one core source then relink:
#
#   baseline (debug=2, opt-level=0)   cold 46s   warm 7s   target/ 2.5G
#   + opt-level = 1                   cold 93s   warm 3s   target/ 1.6G
#   debuginfo only (this)             cold 33s   warm 2s   target/ 1.7G
#
# Optimising ~200 dependency crates costs far more than the debuginfo saves,
# and CI cold-builds whenever the rust-cache entry is stale or evicted.
debug = false

# `cargo test` builds the tested target under `test`, which inherits `dev`.
# Spelled out so a future `[profile.dev] debug = 2` for a debugging session
# does not silently re-inflate all ~50 test binaries.
[profile.test]
inherits = "dev"
debug = "line-tables-only"

# Deny warnings across the whole workspace. Each crate opts in with
# `[lints] workspace = true`.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
warnings = "deny"
