[package]
name = "orchestrator-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "totsuka orchestrator core: domain, state machine, and ports (hexagonal architecture)."
# Internal crate — plugin authors depend on `plugin-protocol`, not this. Marking
# it non-publishable lets cargo-deny permit its path dependency on plugin-protocol.
publish = false

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rusqlite.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
regex.workspace = true
tokio.workspace = true
plugin-protocol.workspace = true
semver = { workspace = true, features = ["serde"] }
sha2.workspace = true
toml_edit.workspace = true
reqwest.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Keychain-backed secret store is macOS-only (§5.6: platform::macos isolation).
[target.'cfg(target_os = "macos")'.dependencies]
keyring.workspace = true

[dev-dependencies]
test-support = { workspace = true }
