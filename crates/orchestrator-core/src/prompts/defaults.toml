# Built-in prompt defaults for the orchestrator core (#313).
#
# Embedded in the binary with `include_str!` and parsed once at first use, so
# the text an agent is shown is edited here rather than in Rust source
# (epic #311).
#
# These are DEFAULTS, not the live values: editing this file changes what a
# freshly built totsuka ships with, not what an existing installation uses.
#
# `{placeholder}` substitution is single-pass (`crate::template`), so a value
# that itself contains `{token}` text is inserted, never re-expanded. The
# allowed placeholders differ per key and are stated with each one; an unknown
# placeholder is emitted verbatim at render time.
#
# The `{marker_*}` placeholders resolve to the wire constants in
# `crate::domain::signal`. Those are NOT configurable — `on-stop.sh` and
# `totsuka-opencode.js` parse the literal marker text, and ADR-0020 keeps the
# marker as the one completion signal shared by claude, codex, and opencode.
# What is editable here is the prose that teaches the convention, not the
# convention.

[prompts]

# Injected alongside `marker_self_report` when the worktree is handed over
# without a branch — i.e. implement-mode dispatches that are not resuming onto
# a branch a previous run already made.
#
# Placeholders: none.
#
# Why the orchestrator asks instead of naming the branch itself: most
# repositories carry their own branch-naming convention (`<type>/<slug>` and
# friends), and a name totsuka generates can never follow one. The convention
# is written down inside the repository, and the worktree IS a checkout of it,
# so the agent is the only party in a position to read it.
#
# Three things here are load-bearing. Do not drop them when rewording:
#
#  1. Say the worktree is DETACHED. Without it an agent that means to comply
#     often just commits, and commits on a detached HEAD are reachable from
#     nothing once the worktree is removed.
#  2. No start-point argument on `git switch -c`. The worktree is already at
#     the intended base commit; passing one re-points HEAD and silently
#     discards any work already done in the worktree.
#  3. Branch BEFORE the first commit. Branching afterwards works, but only if
#     the agent remembers — and the orchestrator's periodic HEAD read is what
#     notices the branch, so the earlier it exists the less state is at risk.
#
# This text is NOT emitted in plan mode. Plan-mode panes cannot run git at all
# (claude `--permission-mode plan`, codex `--sandbox read-only`, opencode's
# `bash: deny`), so the instruction would be unfollowable — and on claude it
# would provoke a permission prompt that an unattended pane has nobody to
# answer, turning a no-op into a timeout escalation.
branch_convention = """
[orchestrator] Branch: this worktree is on a DETACHED HEAD at the commit your \
work should start from. Before your first commit, decide a branch name from \
the task at hand and this repository's own naming convention (check its \
CLAUDE.md / AGENTS.md / CONTRIBUTING.md / .claude/rules or the names of \
existing branches), then switch to it with `git switch -c <name>` — with NO \
start-point argument, so the branch is created exactly where HEAD already is. \
Commit only after that.\
"""

# Appended to a `triage` task's instructions when a task source claims the
# repository the task was routed to (#542, ADR-0056).
#
# The plugin supplies `{destination}` — prose it built from its own config
# (which board / database, and how to file into it). Core never parses it and
# never learns what a `project_number` or a `database_id` is; this template
# only frames it.
#
# `triage` only. It is the one profile whose deliverable is an item filed
# somewhere else; an `implement` run works in the repository it was given, and
# a board it has no business touching is noise it might act on.
#
# The demand for the URL is not decoration. The claim's `destination` is prose
# that nothing machine-checks (ADR-0056), so the verification rubric reading
# the agent's report is the only thing standing between "filed it in the right
# place" and "filed it somewhere". Without a URL in the report there is nothing
# for the rubric to judge.
#
# **It must not contradict the source's own instructions.** Every
# `triage_instructions` in the bundled sources already demands the URL of what
# was filed, and on a GitHub board the item *is* the issue — there is no second
# URL. An earlier draft said "the item at that destination, not just an issue
# you opened on the way there", which told the agent to produce a URL that does
# not exist for the commonest destination. What this adds over the source's own
# text is the **completion condition**, not a different URL.
#
# Placeholders: {destination}
project_destination = """
[orchestrator] Where to file it: {destination}
Filing is complete only once the item exists at that destination, and the URL \
of what you filed MUST appear in your final report.\
"""

# Injected into EVERY hook-capable dispatch via `TOTSUKA_PROMPT_CONTEXT`
# (D-12; hook knowledge stays in core per H-01, so source plugins never mention
# markers). The `UserPromptSubmit` hook turns that env into invisible
# `additionalContext`, so this reaches the model without being typed into the
# pane. For a tool without invisible injection (opencode) the same text is
# delivered as visible `extra_context` instead.
#
# Placeholders: {marker_completed} {marker_needs_input} {marker_failed}
#
# Three things here were learned on real hardware and cost a debugging cycle
# each. Do not drop them when rewording:
#
#  1. Teaching the convention UP FRONT makes the FIRST Stop carry a marker, so
#     `on-stop.sh` never has to `block` and force a full regeneration — the
#     pane shows the answer once instead of twice (#131). The `on-stop.sh`
#     block stays as the safety net for when the agent still forgets.
#  2. The delivery contract (found on the `slack-reply` workflow): ONLY the
#     marker-bearing message is published, so it must be a self-contained
#     answer and never a reference to an earlier pane message.
#  3. No marker while background tasks run: that Stop is a heartbeat (R-02)
#     and the session is re-invoked when they finish. An agent that marked the
#     earlier turn "completed" tends to answer the re-invoke with "already
#     answered above", which then becomes the published reply.
#
# The marker line is stripped from the publish artifact (`strip_status_markers`),
# so it never reaches the task source.
marker_self_report = """
[orchestrator] Completion self-report: EVERY time you end your turn, end \
your response with exactly one of the following status markers on its own \
final line — with one exception: while background tasks or subagents are \
still running, do NOT emit a marker (that stop is an intermediate \
heartbeat; you will be re-invoked when they finish — restate the full \
final answer with the marker then). The marker line is stripped \
automatically before the result is delivered, so include it even when \
instructed to output nothing but the answer body: \
{marker_completed} (done) / \
{marker_needs_input} (human input required) / \
{marker_failed} (cannot proceed). \
Delivery contract: ONLY the message carrying the marker is delivered to \
the requester — earlier messages in this session are NEVER delivered. The \
marker-bearing message must therefore contain the complete, \
self-contained answer; never refer to a previous message (no "as stated \
above" / "already answered earlier").\
"""

# The self-report variant for profiles whose completion is judged by a HUMAN at
# the pane — design / implement (#440). It replaces `marker_self_report` as the
# default for those profiles; answer / triage keep the text above.
#
# Same mechanism as `verification_rubric_artifact_url`: a *default* for the
# `marker_self_report` leaf, selected by the profile. Nothing overrides it —
# an operator override of `marker_self_report` used to, until #465 removed the
# override surface for exactly that reason.
#
# What changes: the marker stops meaning "totsuka decides completion" and
# becomes the protocol for ASKING the human. The agent must not emit COMPLETED
# on its own judgment — it parks with NEEDS_INPUT ("awaiting completion
# confirmation") and only emits COMPLETED after the human explicitly approved in
# the conversation.
#
# That parking reason is NOT internal. `run::hooks` hands it to `notify_all` as
# the `WaitingInput` payload, so it is what the operator reads in the Slack
# notification telling them a pane wants them.
# Everything the base text teaches (all three markers, the heartbeat exception,
# the delivery contract) must survive rewording — `missing_markers` validation
# applies to this text through the same `resolve_for` path.
#
# Placeholders: {marker_completed} {marker_needs_input} {marker_failed}
marker_self_report_confirm = """
[orchestrator] Completion self-report: EVERY time you end your turn, end \
your response with exactly one of the following status markers on its own \
final line — with one exception: while background tasks or subagents are \
still running, do NOT emit a marker (that stop is an intermediate \
heartbeat; you will be re-invoked when they finish — restate the full \
final answer with the marker then). The marker line is stripped \
automatically before the result is delivered, so include it even when \
instructed to output nothing but the answer body: \
{marker_completed} (the human approved the work as complete) / \
{marker_needs_input} (human input or confirmation required) / \
{marker_failed} (cannot proceed). \
Completion protocol: the human in this conversation is the final judge of \
completion. When you believe the work is done, do NOT emit \
{marker_completed} on your own judgment — summarize what you did, ask the \
human to confirm — presenting the choices as a short numbered list (e.g. \
"1. Approve completion / 2. Request changes") so the human can answer by \
typing just a number — and end that turn with {marker_needs_input}, setting \
its reason to "awaiting completion confirmation". Emit {marker_completed} only \
after the human has explicitly approved completion in this conversation. \
Delivery contract: ONLY the message carrying the marker is delivered to \
the requester — earlier messages in this session are NEVER delivered. The \
marker-bearing message must therefore contain the complete, \
self-contained answer; never refer to a previous message (no "as stated \
above" / "already answered earlier").\
"""

# The confirm variant for a tool with a native interactive question tool —
# claude (`AskUserQuestion`) and opencode (`question`), selected at dispatch
# time by `ToolCapabilities::interactive_question` (#487). It replaces the
# text above when the workflow's profile confirms with a human AND the
# resolved tool has such a tool; codex (no question tool outside plan mode)
# keeps `marker_self_report_confirm`.
#
# What changes against `marker_self_report_confirm`: the *asking* moves from
# "end the turn with NEEDS_INPUT and wait" into the question tool, so the
# human answers a single-select picker instead of typing free text. The turn
# does NOT end while the question is pending — no Stop fires, so no
# NEEDS_INPUT reaches the orchestrator from this path (ADR-0038 D6). What
# parks the task instead is the PreToolUse hook (claude) / the
# `tool.execute.before` plugin hook (opencode) posting `QuestionPending`
# (ADR-0050). The markers below are therefore NOT dead text: COMPLETED /
# FAILED remain the only completion wire signal (ADR-0020), and NEEDS_INPUT
# is the documented fallback for when the question tool is unavailable —
# which is also why this text must survive `missing_markers` validation.
#
# Placeholders: {marker_completed} {marker_needs_input} {marker_failed}
#               {question_tool}
marker_self_report_confirm_question = """
[orchestrator] Completion self-report: EVERY time you end your turn, end \
your response with exactly one of the following status markers on its own \
final line — with one exception: while background tasks or subagents are \
still running, do NOT emit a marker (that stop is an intermediate \
heartbeat; you will be re-invoked when they finish — restate the full \
final answer with the marker then). The marker line is stripped \
automatically before the result is delivered, so include it even when \
instructed to output nothing but the answer body: \
{marker_completed} (the human approved the work as complete) / \
{marker_needs_input} (human input or confirmation required) / \
{marker_failed} (cannot proceed). \
Completion protocol: the human in this conversation is the final judge of \
completion. When you believe the work is done, do NOT emit \
{marker_completed} on your own judgment — summarize what you did, then \
ask the human to confirm through the {question_tool} tool (a \
single-select question with options such as "Approve completion" and \
"Request changes"), not in plain prose. Use the {question_tool} tool the \
same way for any other decision you need from the human mid-task. Emit \
{marker_completed} only after the human has explicitly approved \
completion — through that question or in this conversation. If the \
{question_tool} tool is unavailable or fails, fall back to ending your \
turn with {marker_needs_input}, setting its reason to "awaiting \
completion confirmation" and presenting the choices as a short numbered \
list so the human can answer by typing just a number. \
Delivery contract: ONLY the message carrying the marker is delivered to \
the requester — earlier messages in this session are NEVER delivered. The \
marker-bearing message must therefore contain the complete, \
self-contained answer; never refer to a previous message (no "as stated \
above" / "already answered earlier").\
"""

# The `prompt`-type Stop hook body for `verification = "llm"` workflows (D-01).
# Claude is the only tool with `prompt_verification`; elsewhere the workflow
# degrades to `human` and none of the `verification_*` keys are used.
#
# # This is a CONDITION, not an instruction — read this before rewording
#
# Claude Code hands a `prompt` hook to a judging model under its own fixed
# system prompt, verified against the shipped binary (2.1.224):
#
#     You are evaluating a hook condition in Claude Code. Judge whether the
#     user-provided condition is met.
#     Your response must be a JSON object with one of these shapes:
#     - {"ok": true, "reason": "<reason the condition is met>"}
#     - {"ok": false, "reason": "<reason the condition is not met>"}
#
# `ok: true` lets the turn end. `ok: false` BLOCKS it and shows `reason` to the
# agent (`Prompt hook condition was not met:` is the blocking branch).
#
# **The judge cannot be told to allow or block.** It only answers whether a
# condition holds. #389 shipped a clause reading "in that case ... please allow
# the stop" (quoted here in the original Japanese, because it is the evidence:
# "その場合は…停止を許可してください") and it did nothing: measured live, the
# judge applied that clause correctly and
# quoted it verbatim in all 8 rounds — then still answered `ok: false`, because
# "verification does not apply here" is not "the condition is met". Every round
# blocked, until the operator hit ESC.
#
# So everything below has to read as one condition that is TRUE in every case a
# stop should be allowed. Reword the branches freely; do not turn them back into
# imperatives.
#
# Placeholders: none.
verification_rubric = """
- The turn claims completion, and the work genuinely satisfies the requirements it was given — judged against the current code and state of the target repository, not against the turn's own account of itself. A surface-level self-report does not satisfy this: the change has to actually do what it was meant to do, with nothing broken and nothing left out\
"""

# The rubric for profiles whose deliverable is written **outside** the worktree
# by the agent itself — triage / design / implement (#398, #393 D3).
#
# Those profiles publish nothing through `result/publish`, so the artifact's URL
# in the final message is the *only* channel by which the Orchestrator learns
# the work landed anywhere. Without this the judge would grade the reasoning and
# pass a task that described a design it never posted — the "said it wrote it
# and did not" trap #311 hit twice.
#
# It is a **rubric default**, not an extra section: it replaces
# `verification_rubric` for those profiles rather than being appended, so the
# existing precedence (the workflow's own `rubric` > this > the generic
# default) needs no new rule.
#
# Same grammatical constraint as `verification_rubric` above: this is read as a
# *condition that must be TRUE*, never as an instruction. "Include the URL"
# would be graded as unmet on a stop where the rule does not apply.
#
# ONE bullet, not two. The branches of `verification_prompt` are OR-ed, and the
# two halves here — the URL is present, and what it points at matches the claim
# — have to hold TOGETHER. Splitting them into two bullets would put them in the
# OR list, so a URL with unrelated content behind it would satisfy the
# condition on its own. #398 wrote it as two `- ` lines joined by a line
# continuation, which collapsed them onto one line with a stray `- ` in the
# middle; the semantics happened to survive that, the formatting did not (#465).
#
# Placeholders: none.
verification_rubric_artifact_url = """
- The turn claims completion; the final message actually contains the URL of the deliverable — an issue comment, a Notion page, or a pull request; and the deliverable at that URL is consistent with the work being claimed, whether that is the design, the issue filed, or the implementation. That URL is the only channel by which the Orchestrator learns the deliverable exists anywhere, so wording that describes something not yet done ("will write it up", "about to create the issue") does not count as containing one\
"""

# The rubric for profiles whose completion is judged by a HUMAN at the pane —
# design / implement (#440). It replaces `verification_rubric` (and therefore
# also the artifact-URL default above) for those profiles; triage keeps the
# artifact-URL rubric.
#
# The judge runs in-session, so it can see the conversation — this branch makes
# it check that the human actually approved before a COMPLETED is allowed
# through. It is the mechanical backstop for the confirmation protocol taught
# by `marker_self_report_confirm`: an agent that skips asking and emits
# COMPLETED on its own judgment is blocked at the same layer that today blocks
# a missing marker.
#
# Same grammatical constraint as `verification_rubric`: a *condition that must
# be TRUE*, never an instruction (#389 — the judge cannot be told to allow or
# block). And `{marker_*}` tokens must NOT appear here: the rubric leaf is
# inserted as data, not expanded (see `a_marker_token_inside_the_rubric_is_not_expanded`).
#
# Placeholders: none.
verification_rubric_human_approval = """
- The turn claims completion, and earlier in this conversation the human explicitly approved that the work is complete. The human's own message counts as that approval, and so does the human's selected answer to a confirmation question the agent posed through an interactive question tool, whatever form that answer takes in the transcript. What never counts is the agent inferring approval, asserting it would be approved, or its own request for confirmation. A completion claim with no human approval yet does not satisfy this condition — the sequence that does is to ask for confirmation first and wait for the human's answer\
"""

# Intermediate-Stop branch, mirroring `on-stop.sh`'s R-02/D-12 rule: a Stop with
# background tasks still running is a heartbeat, not a completion claim.
#
# Without it the judge answers `ok: false` on every such Stop — a spurious
# "Stop hook error" in the pane, and the session busy-waits in-turn instead of
# yielding to the task-notification re-invoke (real-machine finding on the
# `slack-reply` workflow).
#
# Placeholders: none.
verification_background_exemption = """
- The turn is an intermediate stop that ends while background tasks — subagents and the like — are still running. That is a heartbeat, not a claim of completion\
"""

# Non-claim branch: a Stop whose final message already reports NEEDS_INPUT or
# FAILED is not claiming completion, so there is nothing to verify (#389).
#
# This mirrors `on-stop.sh`, which accepts any present marker and only ever
# blocks on a MISSING one. Without this branch the two hooks contradict each
# other on the same Stop: the command hook records `waiting_input` and exits 0
# while the judge keeps the turn alive.
#
# Placeholders: {marker_needs_input} {marker_failed}
verification_nonclaim_exemption = """
- The final message reports {marker_needs_input} or {marker_failed}. The agent is itself reporting that the work is not finished, so there is no completion claim here to verify\
"""

# What the judge should put in `reason` when it answers `ok: false`. That text
# is fed back to the agent as the block reason, and the agent's next turn has to
# carry a marker for `on-stop.sh` to parse (D-12) — so the convention is taught
# here, where the agent will actually read it. Drop the markers and every
# re-asked Stop parses as UNKNOWN.
#
# Placeholders: {marker_completed} {marker_needs_input} {marker_failed}
verification_marker_convention = """
When the condition is not met, the reason must say what is missing and must also say this: end your response with exactly one of {marker_completed} / {marker_needs_input} / {marker_failed} on its own final line.\
"""

# How the branches above are assembled into the hook's `prompt` field.
#
# The leading sentence is what makes the whole thing a condition rather than a
# list of orders — see the block comment on `verification_rubric`. The branches
# are OR-ed, so the order among them does not change the verdict; the completion
# branch is last because it is the only one that needs investigation, and the
# two cheap structural checks should settle the common cases first.
#
# Rendering is two staged single passes — the leaves first (markers
# substituted), then this over the results — so a literal `{marker_convention}`
# written inside a branch is inserted, not expanded.
#
# Placeholders: {rubric} {background_exemption} {nonclaim_exemption}
#               {marker_convention}
verification_prompt = "This stop may be allowed. That is, at least one of the following holds:\n\n{nonclaim_exemption}\n{background_exemption}\n{rubric}\n\n{marker_convention}"

# The prose body of the opencode plan-mode agent (`agents/totsuka-plan.md`),
# selected at launch with `--agent totsuka-plan`.
#
# Placeholders: none.
#
# This is the BODY ONLY. The YAML frontmatter — `mode: primary` plus
# `permission: {edit: deny, bash: deny, task: deny}` — is fixed in Rust
# (`hooks::opencode::PLAN_AGENT_FRONTMATTER`) and deliberately NOT configurable:
# that deny map is the *whole* of what carries plan intent here (not a
# guarantee — nothing is, ADR-0045 — and never measured on real opencode, but
# the only mechanism there is), and a key that reads like
# prose must never be able to grant `bash: allow`. For the same reason this body
# must not start with `---` — that would produce two frontmatter blocks, which
# opencode parses in an undefined way. Config used to be able to supply the
# body, and `config::validate` rejected a `---` in what it supplied; #465 made
# the body built-in, so there is no operator value left to reject and no such
# check any more. What holds the invariant now is
# `plan_agent_renders_its_exact_bytes`, which pins the rendered file byte for
# byte.
#
# One `agents/totsuka-plan.md` on disk is shared by every opencode session, and
# `--agent totsuka-plan` has no per-workflow dimension — which is why this was
# global-only for as long as it was configurable at all (#465 removed that).
#
# opencode is the tool without invisible injection, so unlike claude
# (`--permission-mode plan`) and codex (`--sandbox read-only`) the plan intent
# has no structural channel: this agent file is the whole mechanism.
opencode_plan_agent = """
You are operating in design and planning mode. Editing files, running commands,
and delegating to subagents are all denied by permission — including edits made
through a subagent. Work from reading and analysis, and present the plan or
design in prose.
"""
