# Built-in prompt defaults for the orchestrator core (#313).
#
# Embedded in the binary with `include_str!` and parsed once at first use, so
# the text an agent is shown is edited here rather than in Rust source
# (epic #311).
#
# These are DEFAULTS, not the live values: editing this file changes what a
# freshly built totsuka ships with, not what an existing installation uses.
#
# `{placeholder}` substitution is single-pass (`crate::template`), so a value
# that itself contains `{token}` text is inserted, never re-expanded. The
# allowed placeholders differ per key and are stated with each one; an unknown
# placeholder is emitted verbatim at render time.
#
# The `{marker_*}` placeholders resolve to the wire constants in
# `crate::domain::signal`. Those are NOT configurable — `on-stop.sh` and
# `totsuka-opencode.js` parse the literal marker text, and ADR-0020 keeps the
# marker as the one completion signal shared by claude, codex, and opencode.
# What is editable here is the prose that teaches the convention, not the
# convention.

[prompts]

# Injected alongside `marker_self_report` when the worktree is handed over
# without a branch — i.e. implement-mode dispatches that are not resuming onto
# a branch a previous run already made.
#
# Placeholders: none.
#
# Why the orchestrator asks instead of naming the branch itself: most
# repositories carry their own branch-naming convention (`<type>/<slug>` and
# friends), and a name totsuka generates can never follow one. The convention
# is written down inside the repository, and the worktree IS a checkout of it,
# so the agent is the only party in a position to read it.
#
# Three things here are load-bearing. Do not drop them when rewording:
#
#  1. Say the worktree is DETACHED. Without it an agent that means to comply
#     often just commits, and commits on a detached HEAD are reachable from
#     nothing once the worktree is removed.
#  2. No start-point argument on `git switch -c`. The worktree is already at
#     the intended base commit; passing one re-points HEAD and silently
#     discards any work already done in the worktree.
#  3. Branch BEFORE the first commit. Branching afterwards works, but only if
#     the agent remembers — and the orchestrator's periodic HEAD read is what
#     notices the branch, so the earlier it exists the less state is at risk.
#
# This text is NOT emitted in plan mode. Plan-mode panes cannot run git at all
# (claude `--permission-mode plan`, codex `--sandbox read-only`, opencode's
# `bash: deny`), so the instruction would be unfollowable — and on claude it
# would provoke a permission prompt that an unattended pane has nobody to
# answer, turning a no-op into a timeout escalation.
branch_convention = """
[orchestrator] Branch: this worktree is on a DETACHED HEAD at the commit your \
work should start from. Before your first commit, decide a branch name from \
the task at hand and this repository's own naming convention (check its \
CLAUDE.md / AGENTS.md / CONTRIBUTING.md / .claude/rules or the names of \
existing branches), then switch to it with `git switch -c <name>` — with NO \
start-point argument, so the branch is created exactly where HEAD already is. \
Commit only after that.\
"""

# Injected into EVERY hook-capable dispatch via `TOTSUKA_PROMPT_CONTEXT`
# (D-12; hook knowledge stays in core per H-01, so source plugins never mention
# markers). The `UserPromptSubmit` hook turns that env into invisible
# `additionalContext`, so this reaches the model without being typed into the
# pane. For a tool without invisible injection (opencode) the same text is
# delivered as visible `extra_context` instead.
#
# Placeholders: {marker_completed} {marker_needs_input} {marker_failed}
#
# Three things here were learned on real hardware and cost a debugging cycle
# each. Do not drop them when rewording:
#
#  1. Teaching the convention UP FRONT makes the FIRST Stop carry a marker, so
#     `on-stop.sh` never has to `block` and force a full regeneration — the
#     pane shows the answer once instead of twice (#131). The `on-stop.sh`
#     block stays as the safety net for when the agent still forgets.
#  2. The delivery contract (found on the `slack-reply` workflow): ONLY the
#     marker-bearing message is published, so it must be a self-contained
#     answer and never a reference to an earlier pane message.
#  3. No marker while background tasks run: that Stop is a heartbeat (R-02)
#     and the session is re-invoked when they finish. An agent that marked the
#     earlier turn "completed" tends to answer the re-invoke with "already
#     answered above", which then becomes the published reply.
#
# The marker line is stripped from the publish artifact (`strip_status_markers`),
# so it never reaches the task source.
marker_self_report = """
[orchestrator] Completion self-report: EVERY time you end your turn, end \
your response with exactly one of the following status markers on its own \
final line — with one exception: while background tasks or subagents are \
still running, do NOT emit a marker (that stop is an intermediate \
heartbeat; you will be re-invoked when they finish — restate the full \
final answer with the marker then). The marker line is stripped \
automatically before the result is delivered, so include it even when \
instructed to output nothing but the answer body: \
{marker_completed} (done) / \
{marker_needs_input} (human input required) / \
{marker_failed} (cannot proceed). \
Delivery contract: ONLY the message carrying the marker is delivered to \
the requester — earlier messages in this session are NEVER delivered. The \
marker-bearing message must therefore contain the complete, \
self-contained answer; never refer to a previous message (no "as stated \
above" / "already answered earlier").\
"""

# The `prompt`-type Stop hook body for `verification = "llm"` workflows (D-01).
# Claude is the only tool with `prompt_verification`; elsewhere the workflow
# degrades to `human` and none of the `verification_*` keys are used.
#
# # This is a CONDITION, not an instruction — read this before rewording
#
# Claude Code hands a `prompt` hook to a judging model under its own fixed
# system prompt, verified against the shipped binary (2.1.224):
#
#     You are evaluating a hook condition in Claude Code. Judge whether the
#     user-provided condition is met.
#     Your response must be a JSON object with one of these shapes:
#     - {"ok": true, "reason": "<reason the condition is met>"}
#     - {"ok": false, "reason": "<reason the condition is not met>"}
#
# `ok: true` lets the turn end. `ok: false` BLOCKS it and shows `reason` to the
# agent (`Prompt hook condition was not met:` is the blocking branch).
#
# **The judge cannot be told to allow or block.** It only answers whether a
# condition holds. #389 shipped an "その場合は…停止を許可してください" clause and
# it did nothing: measured live, the judge applied that clause correctly and
# quoted it verbatim in all 8 rounds — then still answered `ok: false`, because
# "verification does not apply here" is not "the condition is met". Every round
# blocked, until the operator hit ESC.
#
# So everything below has to read as one condition that is TRUE in every case a
# stop should be allowed. Reword the branches freely; do not turn them back into
# imperatives.
#
# Placeholders: none.
verification_rubric = """
- 完了を申告しており、かつ作業が指示された要件を実際に満たしている。対象リポジトリの現在のコードと状態に基づいて確かめること。表面的な自己申告では足りず、変更が意図どおり機能し破綻や取りこぼしが無いこと\
"""

# Intermediate-Stop branch, mirroring `on-stop.sh`'s R-02/D-12 rule: a Stop with
# background tasks still running is a heartbeat, not a completion claim.
#
# Without it the judge answers `ok: false` on every such Stop — a spurious
# "Stop hook error" in the pane, and the session busy-waits in-turn instead of
# yielding to the task-notification re-invoke (real-machine finding on the
# `slack-reply` workflow).
#
# Placeholders: none.
verification_background_exemption = """
- バックグラウンドタスク（サブエージェント等）が実行中のままターンを終える中間停止である。これはハートビートであって完了申告ではない\
"""

# Non-claim branch: a Stop whose final message already reports NEEDS_INPUT or
# FAILED is not claiming completion, so there is nothing to verify (#389).
#
# This mirrors `on-stop.sh`, which accepts any present marker and only ever
# blocks on a MISSING one. Without this branch the two hooks contradict each
# other on the same Stop: the command hook records `waiting_input` and exits 0
# while the judge keeps the turn alive.
#
# Placeholders: {marker_needs_input} {marker_failed}
verification_nonclaim_exemption = """
- 最終メッセージが {marker_needs_input} または {marker_failed} を報告している。エージェント自身が未完了を申告しているので、完了検証の対象ではない\
"""

# What the judge should put in `reason` when it answers `ok: false`. That text
# is fed back to the agent as the block reason, and the agent's next turn has to
# carry a marker for `on-stop.sh` to parse (D-12) — so the convention is taught
# here, where the agent will actually read it. Drop the markers and every
# re-asked Stop parses as UNKNOWN.
#
# Placeholders: {marker_completed} {marker_needs_input} {marker_failed}
verification_marker_convention = """
条件が満たされていない場合は、何が不足しているかに加えて「応答の最終行に {marker_completed} / {marker_needs_input} / {marker_failed} のいずれかを付けること」を reason に含めること。\
"""

# How the branches above are assembled into the hook's `prompt` field.
#
# The leading sentence is what makes the whole thing a condition rather than a
# list of orders — see the block comment on `verification_rubric`. The branches
# are OR-ed, so the order among them does not change the verdict; the completion
# branch is last because it is the only one that needs investigation, and the
# two cheap structural checks should settle the common cases first.
#
# Rendering is two staged single passes — the leaves first (markers
# substituted), then this over the results — so a literal `{marker_convention}`
# written inside a branch is inserted, not expanded.
#
# Placeholders: {rubric} {background_exemption} {nonclaim_exemption}
#               {marker_convention}
verification_prompt = "この停止を許可してよい。すなわち次のいずれかが成り立つ:\n\n{nonclaim_exemption}\n{background_exemption}\n{rubric}\n\n{marker_convention}"

# The prose body of the opencode plan-mode agent (`agents/totsuka-plan.md`),
# selected at launch with `--agent totsuka-plan`.
#
# Placeholders: none.
#
# This is the BODY ONLY. The YAML frontmatter — `mode: primary` plus
# `permission: {edit: deny, bash: deny, task: deny}` — is fixed in Rust
# (`hooks::opencode::PLAN_AGENT_FRONTMATTER`) and deliberately NOT configurable:
# that deny map *is* plan mode's read-only guarantee, and a key that reads like
# prose must never be able to grant `bash: allow`. Validation rejects a body
# starting with `---` for the same reason (it would also produce two
# frontmatter blocks, which opencode parses in an undefined way).
#
# Global only — there is one `agents/totsuka-plan.md` on disk shared by every
# opencode session, and `--agent totsuka-plan` has no per-workflow dimension.
# Writing this under `[[workflows]].prompts` is a parse error naming the key.
#
# opencode is the tool without invisible injection, so unlike claude
# (`--permission-mode plan`) and codex (`--sandbox read-only`) the plan intent
# has no structural channel: this agent file is the whole mechanism.
opencode_plan_agent = """
あなたは設計・計画立案モードで動作しています。ファイルの編集・コマンド実行・
サブエージェントへの委譲は権限で拒否されます（サブエージェント経由の編集も
不可）。読み取りと分析に基づいて、計画・設計を文章で提示してください。
"""
