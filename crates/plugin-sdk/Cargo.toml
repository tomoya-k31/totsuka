[package]
name = "plugin-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime, dispatch, submit and poll helpers for totsuka task_source plugins (stdio JSON-RPC)."
# Internal crate — depends on plugin-protocol by path, so it must be
# non-publishable for cargo-deny to permit the path dependency.
publish = false

[lints]
workspace = true

[dependencies]
plugin-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
# `io-std` (stdin/stdout) is on top of the workspace tokio feature set.
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-std", "test-util"] }
semver = { workspace = true, features = ["serde"] }
