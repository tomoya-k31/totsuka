[package]
name = "orchestrator-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "totsuka CLI entrypoint (bin: totsuka)."
# Internal binary crate — never published to crates.io.
publish = false

[lints]
workspace = true

[[bin]]
name = "totsuka"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
orchestrator-core = { path = "../orchestrator-core" }
plugin-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
test-support = { workspace = true }
# `setup::plugin_config` writes each plugin's own config file; the test that
# matters asserts the plugin's real deserializer accepts what it wrote, not
# merely that it is TOML. Dev-only — the CLI never links a plugin at run time.
task-source-github.workspace = true
task-source-slack.workspace = true
# The state.db downgrade guard test (#275) forges a schema version no binary
# can know; there is deliberately no public API for writing the ledger.
rusqlite.workspace = true
# The Slack E2E (tests/slack_e2e.rs) runs an in-process mock Slack: raw-TCP
# Web API + Socket Mode WebSocket.
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
