[package]
name = "orchestrator-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "totsuka CLI entrypoint (bin: totsuka)."
# Internal binary crate — never published to crates.io.
publish = false

[lints]
workspace = true

[[bin]]
name = "totsuka"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
orchestrator-core = { path = "../orchestrator-core" }
plugin-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true

[dev-dependencies]
test-support = { workspace = true }
# The Slack E2E (tests/slack_e2e.rs) runs an in-process mock Slack: raw-TCP
# Web API + Socket Mode WebSocket.
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
