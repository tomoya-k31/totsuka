# $E2E_HOME/cfg/totsuka/plugins/slack.toml
#
# トークンの置き方は 2 通り。1Password を使うと常駐プロセスは人間のターミナルから
# しか起動できない（op read がデスクトップ承認を要求するため）。
app_token = "op://Dev/Totsuka - local/app_token"
user_token = "op://Dev/Totsuka - local/user_token"
bot_token = "op://Dev/Totsuka - local/bot_token"
# 環境変数に置く場合はこちら（トークンが平文でディスクに載る）:
#app_token = "${E2E_SLACK_APP_TOKEN}"
#user_token = "${E2E_SLACK_USER_TOKEN}"
#bot_token = "${E2E_SLACK_BOT_TOKEN}"

# 運用者本人のメンバー ID。auth.test の identity と一致検証される（なりすまし防止）。
target_user_id = "U________"

# 本人が付けるとタスクを起こす絵文字（#319）。省略 = 無効。
#
# リアクション起動は config.toml の [[workflows]].trigger.reaction で設定する。
# 個人ワークスペースを流用するなら、日常で押さないカスタム絵文字にすること。
# `eyes` にすると普段どおり 👀 を付けた瞬間にタスクが起動する。
#
# この機能には user token の `reactions:read` が要る。無いと Slack はイベントを
# 配送せず、エラーも出ない（TokenGuard が警告する）。

reply_style = "丁寧語で簡潔に"

# [[repos]] は書かない。config.toml の [[repositories]] がそのまま候補になり（#109）、
# 分類は config.toml の [llm] が initialize で供給される（#119）。
# 候補を 1 件に絞りたいとき（LLM キーがまだ無い等）だけ明示する:
#[[repos]]
#name = "totsuka-sandbox-web"
#summary = "顧客向けの Web アプリ"
