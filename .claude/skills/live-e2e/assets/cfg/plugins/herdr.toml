# $E2E_HOME/cfg/totsuka/plugins/herdr.toml
#
# socket_path を明示している理由:
# 既定は $XDG_CONFIG_HOME/herdr/herdr.sock に解決されるが、検証では XDG を
# $E2E_HOME/cfg へ隔離しているため、そこを見にいって「cannot connect to herdr socket」で
# initialize が落ちる。herdr は totsuka とは別プログラムで、ソケットは本物の ~/.config にある。
socket_path = "${HOME}/.config/herdr/herdr.sock"

# agent_command / plan_args は 0.2.3 以降 deprecated なので書かない。
# 起動する CLI は config.toml の [tools] レジストリ側（既定 claude）が決める。

[layout]
# エージェントの隣にシェル pane を割り、様子を見ながら手で git を叩けるようにする。
# ratio は分割元（= エージェント pane）の取り分。
shell = true
direction = "down"
ratio = 0.8

# 実行ファイル名 → herdr の kind の写像（ADR-0032 D-1）。claude / codex / opencode は
# そのまま通るので通常は不要。ラッパースクリプトを使うときだけ書く。
#[kind_map]
#my-claude = "claude"
