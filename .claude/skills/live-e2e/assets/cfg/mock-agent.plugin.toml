# mock_agent を agent_ide として install するための plugin.toml。
# 実エージェントの前に経路だけ通したいときに使う（バイナリは
# target/debug/mock_plugin を `mock_agent` の名前で同じディレクトリに置く）。
name = "mock_agent"
kind = "agent_ide"
version = "0.1.0"
# 上限は同梱 6 プラグインと同じ `<0.6`。理由は agent_ide 一般ではなく
# **このテストダブルについて**の話で、mock_plugin は 0.4.0 で消えた
# `TaskDispatchParams.hook` / `Capabilities.design_preview` も、0.5.0 で消えた
# 到達不能な宣言も読んでいない（dispatch params は記録するだけ）。
# 0.4.0 の削除は agent_ide の使う面に**触れている** — herdr は下限を
# `>=0.2.3` へ上げている。
#
# **この manifest は `plugins/` の外にあるため、バンプのたびに数え落とされうる**。
# 0.4.0（#413）は 7 本とも動かしたが、0.5.0（#501）は 6 本だけで、ここが
# `<0.5` のまま取り残された（#526）。`enabled = false` なので実害は出ず、
# mock で経路を通そうとした瞬間にだけ F-54 で拒否される。手で数える運用は
# 「捕まえた回は正しいが、当てにならない」ので、plugin-protocol の
# `tests/bundled_manifests.rs` がこのファイルも走査対象に含めている。
protocol_version = ">=0.1.6, <0.6"

[capabilities]
state_stream = true
# `outputs` は宣言しない。manifest の `outputs` を読むのは workflow 検証の
# `source_outputs(&wf.source)` だけで、`wf.source` は `check_plugin_ref` が
# `kind = task_source` に限定している。`kind = agent_ide` のこの manifest では
# 何も読まないので、書いても「誰も読まない宣言」にしかならない。
# herdr / orca も宣言していない。
#
# ADR-0052 の `declaration-consumed` はこれを捕まえない — あの検査は
# 「`Capabilities` のフィールドを**誰か**が読んでいるか」を見るもので、
# `outputs` には実在の読み手（task_source の workflow 検証）がいる。
# ここで死んでいるのは型ではなく**この manifest インスタンスの宣言**で、
# 同じ壊れ方の 1 段下である。
