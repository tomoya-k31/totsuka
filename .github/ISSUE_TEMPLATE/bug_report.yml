name: Bug report
description: Report a problem with totsuka
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the `totsuka doctor --json`
        output — it captures your git version, config validity, plugin
        connectivity, and worktree state, which is what we need to triage.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Running `totsuka run` ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`totsuka doctor --json` output"
      description: Paste the full JSON. Redact any values you consider sensitive.
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: totsuka version
      description: Output of `totsuka --version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Output of `totsuka logs --task <id>` if a specific task is involved. Secrets are masked by totsuka, but double-check before pasting."
      render: shell
    validations:
      required: false
