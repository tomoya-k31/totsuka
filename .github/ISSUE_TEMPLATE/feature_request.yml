name: Feature request
description: Suggest an idea for totsuka
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that totsuka does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like totsuka to do? Reference the spec (docs/orchestrator-spec.md) if relevant.
    validations:
      required: false
