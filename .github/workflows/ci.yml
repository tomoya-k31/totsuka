name: ci

on:
  pull_request:
  push:
    branches: [main]

# Actions billing rounds every job UP to the next full minute, so the job
# count — not just wall-clock — drives cost. Jobs are therefore consolidated
# and gated by event: PRs run clippy/rustfmt + test + machete, pushes to main
# run coverage only
# (llvm-cov executes the same test suite, so main is still tested per merge).
# None of these jobs is a required status check (the ruleset requires only
# okf-lint's `lint`), so event gating cannot leave a PR blocked on "Expected".

# Cancel superseded runs on PR branches only. On main, coverage doubles as
# the per-merge test run, so a rapid follow-up merge must queue behind it,
# not cancel it — otherwise the earlier merge is never verified on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  clippy:
    name: clippy / rustfmt
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check formatting
        run: cargo fmt --all --check
      # ワークスペース依存境界の fitness function (#172)。cargo metadata --no-deps
      # ベースで数秒で終わるため、重い clippy より先に fail-fast させる。
      - name: Check architecture invariants
        run: bash scripts/arch-lint.sh
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-features

  # Unused-dependency drift guard (#171). cargo-machete is a text-level scan
  # (no compilation, no Rust toolchain), so it runs on every PR in seconds.
  # False positives (macro / re-export driven) are suppressed per crate via
  # `[package.metadata.cargo-machete] ignored = [...]` with a reason comment.
  # Runner: ubuntu-slim — no Docker/privileged steps, a single-core text scan
  # that finishes in seconds, and not a required status check, so a slim
  # failure cannot block a merge or release.
  machete:
    name: machete (unused deps)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install cargo-machete
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-machete
      - name: Run cargo-machete
        run: cargo-machete

  # cargo-audit / cargo-deny moved to audit.yml (daily cron + dependency-file
  # PRs): advisories change with time, not with PR content.

  # Runs only on push to main: llvm-cov executes the full test suite under
  # instrumentation, so this doubles as the per-merge test run for main.
  # Kept as its own job (not merged into `test`) so the instrumented build
  # artifacts don't thrash the normal-build rust-cache PR branches restore.
  coverage:
    name: coverage (llvm-cov)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-llvm-cov
      # Coverage is measured and reported only; no threshold gate (per #45).
      - name: Collect coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
