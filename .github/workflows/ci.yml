name: ci

on:
  pull_request:
  push:
    branches: [main]

# Actions billing rounds every job UP to the next full minute, so the job
# count — not just wall-clock — drives cost. Jobs are therefore consolidated
# and gated by event: PRs run `clippy / rustfmt` (which also carries rustfmt,
# arch-lint and cargo-machete as steps, #281) and `test`; pushes to main run
# coverage (llvm-cov executes the same test suite, so main is still tested per
# merge). The main-scoped rust-cache entries that every PR's first run restores
# from are regenerated by the separate warm-cache workflow (#341 / ADR-0029) —
# it needs a path filter, and `on:` filters cannot be scoped to one job here.
# None of these jobs is a required status check (the ruleset requires only
# okf-lint's `lint`), so event gating cannot leave a PR blocked on "Expected".

# Least privilege: every job here only checks out, builds, caches and
# uploads an artifact — none of them calls the GitHub API. Declaring this
# pins the token to read-only regardless of the repository default.
permissions:
  contents: read

# Cancel superseded runs on PR branches only. On main, coverage doubles as
# the per-merge test run, so a rapid follow-up merge must queue behind it,
# not cancel it — otherwise the earlier merge is never verified on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  clippy:
    name: clippy / rustfmt
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      # Cargo.lock ドリフトの検出 (#290)。--locked は「lock の更新が必要なら
      # エラーで止まる」ので、これだけで Cargo.toml と食い違った lock を PR で
      # 捕まえられる。ビルドを伴わないため数秒。
      #
      # キャッシュ復元より前に置くのは意図的で、rust-cache は Cargo.lock を
      # キャッシュキーに含むため、ドリフトしたままのキーでエントリを作らせない。
      # 代償として登録レジストリ索引の取得がキャッシュに乗らないが、clippy
      # ジョブはクリティカルパスではない (#281)。
      #
      # ビルド/テスト側を --locked にはしない。CI が lock を直せなくなり、
      # Renovate PR や release-please の sync-lockfile と相互作用するため
      # (release-please は意図的に --locked を外している)。ここは検出専用。
      - name: Cargo.lock is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null
      # shared-key: 既定のキャッシュキーはジョブ id 由来なので、ジョブを改名すると
      # キャッシュが無言で孤児化する。warm-cache ジョブがこの鍵空間へ書き込む前提も
      # あるため明示する (#341)。
      #
      # hashFiles('Cargo.toml'): rust-cache が鍵に含めるマニフェストは cargo metadata
      # のパッケージ由来で、workspace root の Cargo.toml は virtual manifest ゆえに
      # 含まれない。そこに [profile.*] が置かれているため、#281 の `debug = false` は
      # 鍵を 1 ビットも変えないまま全成果物のフィンガープリントを無効化した。root を
      # 明示的に鍵へ入れて同じ事故を構造的に防ぐ (#341 / ADR-0029)。
      #
      # ハッシュを shared-key に畳み込んでいるのは、`key` 入力が使えないため。
      # rust-cache v2.9.1 の src/config.ts:74-88 は shared-key と key を排他に
      # 扱っており、shared-key があると key は読まれずに黙って捨てられる。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: clippy-${{ hashFiles('Cargo.toml') }}
      - name: Check formatting
        run: cargo fmt --all --check
      # ワークスペース依存境界の fitness function (#172)。cargo metadata --no-deps
      # ベースで数秒で終わるため、重い clippy より先に fail-fast させる。
      - name: Check architecture invariants
        run: bash scripts/arch-lint.sh
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # 未使用依存ドリフトの検出 (#171)。cargo-machete はテキスト走査
      # (コンパイル不要・数秒) なので、独立ジョブだと切り上げ課金 1 分がまるごと
      # 固定費になる。clippy ジョブは 35 秒前後でクリティカルパスでもないため、
      # ここへ吸収しても wall-clock は変わらず課金だけ 1 分減る (#281)。
      # 誤検知はクレートごとに `[package.metadata.cargo-machete] ignored = [...]`
      # で理由コメント付きに抑止する。
      - name: Install cargo-machete
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-machete
      - name: Run cargo-machete
        run: cargo-machete

  test:
    name: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      # shared-key にハッシュを畳み込む理由は clippy ジョブのコメントを参照 (#341)。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: test-${{ hashFiles('Cargo.toml') }}
      # --all-targets はこのワークスペースでは --lib --bins --tests と等価。
      # examples/ も benches/ も無く、[[example]] / [[bench]] 宣言も無いため
      # (#341 で列挙して確認)。つまり直後の `cargo test` がどのみち作る集合と同じで、
      # このステップは「重複した仕事」ではない。存在理由は下の
      # TEST_SUPPORT_PREBUILT_BINS が前提とする順序保証であり、消すと同じ作業が
      # Test ステップへ移動するだけで速くならない。
      - name: Build
        run: cargo build --workspace --all-targets
      # CLI の E2E が起動する兄弟バイナリ (mock_plugin / slack) は
      # 上の Build で必ず出来ているので、テストごとに `cargo build` を
      # 呼び直させない (#281)。名前が TOTSUKA_ 始まりでないのは意図的で、
      # 未知の TOTSUKA_* は子プロセスの stderr へ警告を出し (ADR-0009)、
      # stderr を JSON として読むテストを壊すため。
      - name: Test
        env:
          TEST_SUPPORT_PREBUILT_BINS: "1"
        run: cargo test --workspace --all-features

  # cargo-audit / cargo-deny moved to audit.yml (daily cron + dependency-file
  # PRs): advisories change with time, not with PR content.

  # Runs only on push to main: llvm-cov executes the full test suite under
  # instrumentation, so this doubles as the per-merge test run for main.
  # Kept as its own job (not merged into `test`) so the instrumented build
  # artifacts don't thrash the normal-build rust-cache PR branches restore.
  coverage:
    name: coverage (llvm-cov)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      # shared-key にハッシュを畳み込む理由は clippy ジョブのコメントを参照 (#341)。
      # 計装済み成果物は通常ビルドと混ぜられないので、鍵は独立のままにする。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: coverage-${{ hashFiles('Cargo.toml') }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-llvm-cov
      # Coverage is measured and reported only; no threshold gate (per #45).
      #
      # cargo llvm-cov は内部で `cargo test --workspace` 相当を走らせるため、
      # テスト実行前に workspace の全 bin をビルド済み。test_support::sibling_bin は
      # anchor (env!("CARGO_BIN_EXE_totsuka")) の親ディレクトリからパスを導くので、
      # llvm-cov が CARGO_TARGET_DIR を差し替えても自動追従する。これを立てないと
      # main への merge のたびに E2E が cargo build をシェルアウトし、ADR-0018 §3 の
      # 「CI では 0 回」が main で成立していなかった (#341)。仮定が外れた場合は
      # sibling_bin の assert!(path.exists(), ...) で落ちるので、黙って古いバイナリを
      # 検証する経路はない。
      - name: Collect coverage
        env:
          TEST_SUPPORT_PREBUILT_BINS: "1"
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
