name: herdr-schema-watch

# herdr の新しい stable が出たことを検知して issue を立てる。
#
# **PR の CI ではこれをやらない。** herdr がリリースされた瞬間に無関係な PR が
# 全部赤くなり、ネットワーク障害でも落ちるため。PR の CI（ci.yml の
# `herdr-schema-check`）はコミット済み schema とだけ突き合わせ、新版への追随は
# この別レーンが持つ（#520 §2）。audit.yml の日次 cron が前例。
#
# herdr の stable は約 2 週間ごとなので、日次で十分に速い。

on:
  schedule:
    - cron: "23 20 * * *" # 05:23 JST daily
  workflow_dispatch:

# issue を立てるためだけに write が要る。checkout は read で足りる。
permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  watch:
    name: check for a newer herdr
    # gh / curl / jq しか使わない。Docker も特権操作も無く、1 vCPU で足り、
    # 失敗してもリリースを止めない。
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # **prerelease は見ない。** preview ビルドは基底 stable の `version` を
      # 名乗るので、混ぜると同じ版が何度も「新しい」と判定される。
      - name: Find the newest stable herdr release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/herdrdev/herdr/releases --paginate \
            --jq '[.[] | select(.prerelease == false and .draft == false) | .tag_name] | .[0]')"
          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "herdr-schema-watch: 最新の stable タグを取得できませんでした" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
      - name: Compare against the committed slices
        id: diff
        run: |
          version='${{ steps.upstream.outputs.version }}'
          if [ -f "plugins/agent-ide-herdr/schemas/herdr-${version}.json" ]; then
            echo "herdr ${version} は既にコミット済みです"
            echo "new=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # 取得してスライスし、コミット済みの最新版と突き合わせる。ここは
          # jq と curl しか使わない（rustfmt が要るのは生成のときだけ）。
          bash scripts/herdr-types-build.sh --fetch '${{ steps.upstream.outputs.tag }}'
          newest="$(for f in plugins/agent-ide-herdr/schemas/herdr-*.json; do
            jq -r '.sliced_from.herdr_version' "$f"; done | sort -V | tail -2 | head -1)"
          {
            echo "new=1"
            echo "previous=${newest}"
          } >> "${GITHUB_OUTPUT}"
          # 互換検査を新しいスライス込みで回し、その出力を issue 本文に載せる。
          # ここが赤いことは**このジョブの失敗ではない** — それこそが報せたい
          # 中身なので、`|| true` で拾って本文へ回す。
          {
            echo "### \`herdr-schema-check.sh\`（新しいスライスを含めて実行）"
            echo
            echo '```text'
            bash scripts/herdr-schema-check.sh 2>&1 || true
            echo '```'
          } > /tmp/check.md
      - name: Open an issue for the new release
        if: steps.diff.outputs.new == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
          PREVIOUS: ${{ steps.diff.outputs.previous }}
        run: |
          title="chore(herdr): herdr ${VERSION} の API schema を取り込む"
          # 同じ版で毎日立てないよう、開いている同題の issue を先に探す。
          existing="$(gh issue list --state open --search "${title} in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            echo "既に #${existing} が開いています"
            exit 0
          fi
          {
            echo "herdr **${VERSION}** が出ました（コミット済みの最新は ${PREVIOUS}）。"
            echo
            echo "\`\`\`bash"
            echo "bash scripts/herdr-types-build.sh --fetch ${TAG}"
            echo "bash scripts/herdr-schema-check.sh"
            echo "\`\`\`"
            echo
            echo "**このジョブが緑でも、取り込みは必要です。** 検査が見ているのは"
            echo "コミット済みのスライスだけで、取り込むまでこの版は誰も突き合わせて"
            echo "いません（\`wire::NEWEST_CHECKED\` はまだ ${PREVIOUS} のままです）。"
            echo
            echo "検査が赤い場合は**破壊的変更**です。落とす条件と向きは"
            echo "[ADR-0055](../blob/main/ai-docs/decisions/adr-0055-herdr-schema-typed-wire.md) を参照。"
            echo
            cat /tmp/check.md
          } > /tmp/body.md
          gh issue create --title "${title}" --body-file /tmp/body.md --label enhancement
