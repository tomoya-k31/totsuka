name: herdr-schema-watch

# herdr の新しい stable が出たことを検知して issue を立てる。
#
# **PR の CI ではこれをやらない。** herdr がリリースされた瞬間に無関係な PR が
# 全部赤くなり、ネットワーク障害でも落ちるため。PR の CI（ci.yml の
# `herdr-schema-check`）はコミット済み schema とだけ突き合わせ、新版への追随は
# この別レーンが持つ（#520 §2）。audit.yml の日次 cron が前例。
#
# herdr の stable は約 2 週間ごとなので、日次で十分に速い。

on:
  schedule:
    - cron: "23 20 * * *" # 05:23 JST daily
  workflow_dispatch:
    inputs:
      # 起票の手前まで通して、**本文だけ**を目視するための口。重複ガードの
      # 結果はこれとは無関係に毎回ログへ出る（下の `guard` ステップ）ので、
      # ガードが生きているかを確かめるのにこの入力は要らない。
      dry_run:
        description: "起票せず、立てるはずだった issue の本文をログに出す"
        type: boolean
        default: false

# issue を立てるためだけに write が要る。checkout は read で足りる。
permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  watch:
    name: check for a newer herdr
    # gh / curl / jq しか使わない。Docker も特権操作も無く、1 vCPU で足り、
    # 失敗してもリリースを止めない。
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # **prerelease は見ない。** preview ビルドは基底 stable の `version` を
      # 名乗るので、混ぜると同じ版が何度も「新しい」と判定される。
      #
      # `/releases/latest` を使うのは、draft と prerelease を除いた最新を
      # **1 件だけ**返すため。`/releases --paginate --jq` は結合後の配列では
      # なく**ページごと**にフィルタを適用するので、リリースが 100 本を超えた
      # 日に `.[0]` が複数行になり、`GITHUB_OUTPUT` が `Invalid format` で
      # 落ちる（= 新版の検知そのものが止まる）。
      - name: Find the newest stable herdr release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/herdrdev/herdr/releases/latest --jq '.tag_name')"
          # 1 行の、それらしい形であることまで確かめる。上流の値をそのまま
          # 下流のシェルへ流す前に、ここで形を閉じておく。
          case "${tag}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "herdr-schema-watch: 最新の stable タグが読めません: '${tag}'" >&2
              exit 1
              ;;
          esac
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
      # 値は `env:` 経由で渡す。`${{ }}` を `run:` へ直接展開すると、**上流の
      # リポジトリが決めた文字列**がシェルのクォートを抜けうる（このリポジトリの
      # 他のワークフローも例外なく `env:` を使っている）。
      - name: Compare against the committed slices
        id: diff
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          # Actions の既定シェルは `bash -e {0}` で **pipefail が付かない**。
          # 下の `previous` はパイプなので、付けないと jq の失敗が握り潰されて
          # 空文字が流れる。
          set -euo pipefail
          if [ -f "plugins/agent-ide-herdr/schemas/herdr-${VERSION}.json" ]; then
            echo "herdr ${VERSION} は既にコミット済みです"
            echo "new=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # **`--fetch` の前に**取っておく。後で取ると `sort -V | tail -2 | head -1`
          # は「全体の 2 番目に高い版」を返すだけで、新リリースが最高版でない
          # ときに嘘になる（`/releases/latest` は created_at 順なので起こりうる）。
          previous="$(for f in plugins/agent-ide-herdr/schemas/herdr-*.json; do
            jq -r '.sliced_from.herdr_version' "$f"; done | sort -V | tail -1)"
          # 取得してスライスする。ここは jq と curl しか使わない
          # （rustfmt が要るのは生成のときだけ）。
          bash scripts/herdr-types-build.sh --fetch "${TAG}"
          {
            echo "new=1"
            echo "previous=${previous}"
          } >> "${GITHUB_OUTPUT}"
          # **`--compat-only` で回す。** 素の検査は drift も見るが、新しい
          # スライスを置いた直後は drift が**必ず**赤くなる（`NEWEST_CHECKED`
          # がスライス集合から生成されるため）。混ぜると「必ず出る赤」と
          # 「本当に知りたい赤」が区別できなくなり、受け取った人が毎回空振り
          # する。compat は jq だけで動くので、Rust ツールチェインも要らない。
          #
          # 終了コードは 1（違反あり＝報せたい中身）と 2（環境不備＝検査が
          # **動かなかった**）を区別する。1 は本文へ回し、2 はジョブを赤くする
          # — `|| true` で両方飲み込むと、検査が一度も動いていないことに
          # 誰も気づけない。
          set +e
          out="$(bash scripts/herdr-schema-check.sh --compat-only 2>&1)"
          rc=$?
          set -e
          if [ "${rc}" -ge 2 ]; then
            echo "herdr-schema-watch: 互換検査が動きませんでした (exit ${rc})" >&2
            echo "${out}" >&2
            exit 1
          fi
          {
            echo "compat=${rc}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### \`herdr-schema-check.sh --compat-only\`"
            echo
            echo '```text'
            echo "${out}"
            echo '```'
          } > /tmp/check.md
      # **ガードは毎回走らせる。独立ステップなのはそのため。** 起票ステップ側へ
      # 畳むと `new == '1'`（＝未取り込みの版がある日）にしか評価されず、壊れて
      # いても誰も気づけない — 実際この経路は 3.5 週間素通りし続け、同じ 0.9.1 で
      # #710 と #714 が立つまで表に出なかった。ここを外に出しておけば、取り込み
      # 済みの平常日でも照合結果が毎日ログに出る。
      - name: Look for an issue already tracking this version
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          # **`pipefail` が無いとガードが無音で壊れる。** Actions の既定シェルは
          # `bash -e {0}` で pipefail が付かないので、下のパイプの終了コードは
          # 末尾の `jq` のものになる。`gh issue list` がレート制限・API 障害・
          # 認証切れで落ちると stdout は空になるが、**空入力の `jq` は何も出さず
          # 0 で終わる**ため、`existing` が空のまま `set -e` も発火せず、ジョブは
          # 緑のまま起票へ進む。この PR が潰した「エラーにならず 0 件が返る」のと
          # 同じ形が、別経路で戻ってくる。
          set -euo pipefail
          # **重複判定のキーは版そのもの**で、タイトル文字列ではない。人が
          # タイトルを直しても同一性が壊れないよう、本文の先頭へ機械可読な
          # 印を置き、それを突き合わせる。
          marker="<!-- herdr-schema-watch: version=${VERSION} -->"

          # 突き合わせの母数を絞るためのラベル。`--force` なので二度目以降は
          # 色と説明の上書きになるだけで、fork でも作り直しでも自己修復する。
          gh label create herdr-schema \
            --description "herdr の新しい stable schema の取り込み依頼（herdr-schema-watch が自動起票）" \
            --color 0e8a16 --force

          # **`gh issue list --search` は使わない。** タイトルは Conventional
          # Commits なのでスコープ括弧 `chore(herdr):` を含み、GitHub の issue
          # 検索は `(` `)` を**ブーリアンのグルーピング演算子**として解釈する。
          # 結果、クエリは**エラーにもならず 0 件**を返し、重複ガードが毎回
          # 素通りした（同じ 0.9.1 で #710 と #714 が立った）。実測:
          # `chore in:title` は当たるが `chore(herdr) in:title` は 0 件。
          #
          # 一覧クエリ（検索インデックスを経由しない・構文解釈が無い・強整合）
          # に置き換える。検索は非同期インデックスでもあるので、立てた直後の
          # issue が引けない窓もここでは消える。
          #
          # `--state all` にしてあるのは、人が「この版は見送る」と閉じた issue が
          # 翌日また立たないようにするため。取り込めばスライスの存在検査が
          # 早期 return するので、閉じた版を催促し続ける必要はない。
          existing="$(gh issue list --state all --label herdr-schema --limit 100 \
            --json number,body \
            | jq -r --arg m "${marker}" \
                'map(select(.body // "" | contains($m))) | .[0].number // empty')"
          {
            echo "marker=${marker}"
            echo "existing=${existing}"
          } >> "${GITHUB_OUTPUT}"
          if [ -n "${existing}" ]; then
            echo "herdr ${VERSION} は既に #${existing} が持っています"
          else
            echo "herdr ${VERSION} を追う issue はまだありません"
          fi
      - name: Open an issue for the new release
        if: steps.diff.outputs.new == '1' && steps.guard.outputs.existing == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
          PREVIOUS: ${{ steps.diff.outputs.previous }}
          COMPAT: ${{ steps.diff.outputs.compat }}
          MARKER: ${{ steps.guard.outputs.marker }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          title="chore(herdr): herdr ${VERSION} の API schema を取り込む"
          {
            echo "${MARKER}"
            echo
            echo "herdr **${VERSION}** が出ました（コミット済みの最新は ${PREVIOUS}）。"
            echo
            echo "取り込み手順:"
            echo
            echo "\`\`\`bash"
            echo "bash scripts/herdr-types-build.sh --fetch ${TAG}"
            echo "bash scripts/herdr-types-build.sh   # wire.rs を再生成（NEWEST_CHECKED が動く）"
            echo "bash scripts/herdr-schema-check.sh"
            echo "\`\`\`"
            echo
            echo "**再生成の 1 行を飛ばすと \`herdr-schema-check.sh\` は drift で落ちます。**"
            echo "\`wire::NEWEST_CHECKED\` はコミット済みスライス集合から生成されるので、"
            echo "スライスを足せば生成物も変わります（破壊的変更ではありません）。"
            echo
            echo "**このジョブが緑でも、取り込みは必要です。** 検査が見ているのは"
            echo "コミット済みのスライスだけで、取り込むまでこの版は誰も突き合わせて"
            echo "いません（\`wire::NEWEST_CHECKED\` はまだ ${PREVIOUS} のままです）。"
            echo
            if [ "${COMPAT}" != "0" ]; then
              echo "> [!WARNING]"
              echo "> **下の互換検査が赤い = 破壊的変更です。** 落とす条件と向きは"
              echo "> [ADR-0055](../blob/main/ai-docs/decisions/adr-0055-herdr-schema-typed-wire.md) を参照。"
              echo
            fi
            cat /tmp/check.md
          } > /tmp/body.md
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry-run: 起票しません。立てるはずだった issue はこれです。"
            echo "title: ${title}"
            echo "---"
            cat /tmp/body.md
            exit 0
          fi
          gh issue create --title "${title}" --body-file /tmp/body.md \
            --label enhancement --label herdr-schema
