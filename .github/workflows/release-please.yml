name: release-please

on:
  push:
    branches: [main]

# Serialize runs instead of canceling: a canceled run mid-release (tag
# created, universal-binary upload pending) would strand a release. With
# cancel-in-progress off, a newer push waits as the single pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A fine-grained PAT (not the default GITHUB_TOKEN) so the Release PR
          # is created under a real identity and therefore triggers CI — the
          # required `lint` check then reports, and the PR merges without an
          # admin bypass. See ai-docs/operations/release-runbook.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the version in Cargo.toml but never touches
  # Cargo.lock, so the lockfile is left one version behind on every release
  # (the next `cargo` run then regenerates it as an unrelated working-tree
  # diff). Sync it back into the open Release PR here so the merged release
  # commit already carries a consistent lockfile. Runs on every push while a
  # Release PR is open; if release-please force-pushed the branch (resetting
  # the lock), this re-syncs it.
  sync-lockfile:
    name: Sync Cargo.lock in the Release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the open Release PR branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # `// empty` maps a no-match (empty array → null) to an empty string;
          # without it gh prints the literal "null", defeating the -z guard.
          branch=$(gh pr list --state open --label "autorelease: pending" \
            --json headRefName --jq '.[0].headRefName // empty')
          if [ -z "$branch" ]; then
            # prs_created was true, so a missing Release PR is a real anomaly —
            # fail fast. sync-lockfile is not a release gate, so a red run here
            # doesn't block the tag; the next push retries.
            echo "No open Release PR found despite prs_created=true." >&2
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout the Release PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.pr.outputs.branch }}
          # PAT (not GITHUB_TOKEN) so the follow-up push triggers CI on the PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Sync workspace versions into Cargo.lock
        # `--workspace` re-resolves only the workspace members, so external
        # dependencies stay pinned; just the internal crate versions move.
        run: cargo update --workspace

      - name: Commit and push if Cargo.lock changed
        env:
          RELEASE_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync with the release version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock to the release version"
          git push origin "HEAD:${RELEASE_BRANCH}"

  # Build in the SAME workflow run: a Release published with the default
  # GITHUB_TOKEN does not trigger a separate `on: release` workflow, so the
  # universal-binary build is gated on release-please's `release_created`
  # output here instead.
  universal-binary:
    name: Build macOS universal binary
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # Top-level directory inside the tarball. Extracting yields this one
      # directory, so the whole tree can be moved to /usr/local/lib/totsuka and
      # symlinked from /usr/local/bin — which keeps the bundled plugins around
      # as an install source (`totsuka plugin install <dir>`) instead of
      # scattering them into whatever directory the user happened to unpack in.
      PREFIX: totsuka-${{ needs.release-please.outputs.tag_name }}-macos-universal
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (both macOS targets)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build both architectures
        # The whole workspace, not just `--bin totsuka`: the bundled plugins
        # ship in the same tarball so a fresh machine needs no Rust toolchain
        # and no checkout. `--workspace --bins` also builds `mock_plugin`,
        # which is cheap and never packaged — cheaper to maintain than an
        # explicit `-p` list that has to grow with every new plugin.
        #
        # The sync-lockfile job keeps Cargo.lock in step with the release
        # version on the Release PR, so the merged release commit is already
        # consistent. --locked is still omitted defensively so a stray lock
        # drift regenerates rather than blocking the release build.
        run: |
          cargo build --release --workspace --bins --target x86_64-apple-darwin
          cargo build --release --workspace --bins --target aarch64-apple-darwin

      - name: Assemble the universal tree
        # Plugin names come from `plugins/*/plugin.toml`, so adding a plugin
        # needs no edit here. `scripts/arch-lint.sh` guarantees the Cargo bin
        # name equals that `name` (ADR-0027), which is why the same string
        # works as both the build artifact and the installed filename.
        run: |
          set -euo pipefail
          root="dist/${PREFIX}"
          mkdir -p "${root}/plugins"

          # Ad-hoc signature (v1): satisfies Gatekeeper after the user removes
          # the quarantine attribute. Developer ID signing / notarization is a
          # later step (see ai-docs/operations/release-runbook.md).
          # EVERY binary needs it — an unsigned plugin is killed on launch and
          # `totsuka doctor` can only report "crashed or exited".
          fatten() {
            lipo -create -output "$2" \
              "target/x86_64-apple-darwin/release/$1" \
              "target/aarch64-apple-darwin/release/$1"
            codesign --sign - --force "$2"
            lipo -info "$2"
          }

          fatten totsuka "${root}/totsuka"

          for manifest in plugins/*/plugin.toml; do
            name="$(awk -F '"' '
              /^[[:space:]]*\[/ { exit }
              /^[[:space:]]*name[[:space:]]*=/ { print $2; exit }' "${manifest}")"
            if [ -z "${name}" ]; then
              echo "no top-level name in ${manifest}" >&2
              exit 1
            fi
            mkdir -p "${root}/plugins/${name}"
            fatten "${name}" "${root}/plugins/${name}/${name}"
            cp "${manifest}" "${root}/plugins/${name}/"
          done

          cp README.md LICENSE "${root}/"
          find "${root}" -type f | sort

      - name: Package the tarball
        run: |
          set -euo pipefail
          tar -czf "${PREFIX}.tar.gz" -C dist "${PREFIX}"
          # Write only the raw SHA-256 (no filename) so release consumers can
          # verify the tarball without parsing the filename column.
          shasum -a 256 "${PREFIX}.tar.gz" | awk '{print $1}' \
            | tee "${PREFIX}.tar.gz.sha256"

      - name: Smoke-test the tarball
        # Guards the exact regression this release change exists to fix: the
        # README's Quickstart told people to run `totsuka plugin install <dir>`
        # on a source directory that held no binary, so the documented command
        # always failed. It now points at the bundled plugins, and this step is
        # what keeps that promise honest — it runs the same command the README
        # does, against the artifact users actually download.
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf "${PREFIX}.tar.gz" -C "${work}"
          export XDG_CONFIG_HOME="${work}/xdg/config"
          export XDG_DATA_HOME="${work}/xdg/data"
          export XDG_STATE_HOME="${work}/xdg/state"
          export XDG_CACHE_HOME="${work}/xdg/cache"
          totsuka="${work}/${PREFIX}/totsuka"

          "${totsuka}" --version

          # `--bundled` with no path: the same command the README gives, which
          # also exercises the discovery that has to find the tree next to the
          # binary.
          "${totsuka}" plugin install --bundled --all --yes

          # Then the same plugin again, by path. Two things this covers that
          # `--bundled` alone does not: the directory form the README still
          # documents for non-bundled plugins, and the re-install path — which
          # stages and renames rather than overwriting, because macOS caches a
          # code-signature verdict per vnode and an in-place rewrite makes the
          # next exec die on SIGKILL (#292). That failure needs a *signed*
          # binary to reproduce, so this job is the only place it can be caught.
          first="$(ls -d "${work}/${PREFIX}"/plugins/*/ | head -1)"
          "${totsuka}" plugin install "${first}" --yes

          installed="$("${totsuka}" plugin list --json)"
          echo "${installed}"
          count="$(echo "${installed}" | jq '[.[] | select(.installed)] | length')"
          # Same non-recursive glob the assemble step packages from, so the two
          # cannot drift if a nested plugin.toml ever shows up under plugins/.
          expected="$(ls -d plugins/*/plugin.toml | wc -l | tr -d ' ')"
          if [ "${count}" != "${expected}" ]; then
            echo "expected ${expected} installed plugins, got ${count}" >&2
            exit 1
          fi
          rm -rf "${work}"

      - name: Attach artifacts to the release
        run: |
          gh release upload "${TAG}" \
            "${PREFIX}.tar.gz" \
            "${PREFIX}.tar.gz.sha256" \
            --clobber

      # Point the Homebrew tap at the release that was just published. A step
      # in this job rather than a job of its own: Actions billing rounds every
      # job up to a full minute (see ci.yml), the sha256 is already on disk
      # here, and running after the upload means the formula can never point at
      # a URL that 404s.
      #
      # A scripted step rather than a third-party action: the work is two `sed`
      # expressions and a push, and an action would need a SHA pin, a review on
      # every bump, and access to a token that can write to the tap.
      - name: Update the Homebrew formula in the tap
        env:
          # A *different* fine-grained PAT from RELEASE_PLEASE_TOKEN, which is
          # scoped to this repository only and cannot push to the tap.
          # Contents: Read and write on tomoya-k31/homebrew-tap, nothing else.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: tomoya-k31/homebrew-tap
        run: |
          set -euo pipefail

          # Temporary guard, to be removed once the tap is live. A Homebrew
          # formula fetches its `url` with plain curl and no GitHub auth, so
          # the tap cannot work at all while this repository is private. Until
          # then HOMEBREW_TAP_TOKEN is deliberately unset, and warning-and-
          # skipping keeps every release green instead of ending each one on a
          # red step that means nothing. Registering the secret activates this
          # step on its own — there is no second switch to remember.
          # See ai-docs/infrastructure/homebrew-tap.md.
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew formula bump. The tap now lags at whatever release it last recorded."
            exit 0
          fi

          version="${TAG#v}"
          sha="$(cat "${PREFIX}.tar.gz.sha256")"

          work="$(mktemp -d)"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "${work}"
          formula="${work}/Formula/totsuka.rb"

          # Rewrite only the two lines carrying a release identity. The `url` is
          # derived from `version` inside the formula, so it is never edited
          # here and cannot drift from the tag. Anchored patterns, so a sha256
          # mentioned in a comment or in `test do` is left alone. BSD sed on
          # macos-latest requires the -i suffix argument.
          sed -i.bak \
            -e "s|^  version \".*\"\$|  version \"${version}\"|" \
            -e "s|^  sha256 \".*\"\$|  sha256 \"${sha}\"|" \
            "${formula}"
          rm -f "${formula}.bak"

          # Fail loudly if the rewrite did not take. A silently unedited formula
          # keeps pointing at the previous release forever and `brew upgrade`
          # reports "already up-to-date" — a failure nobody would notice until
          # someone asked why they were a version behind.
          grep -q "^  version \"${version}\"\$" "${formula}"
          grep -q "^  sha256 \"${sha}\"\$"       "${formula}"

          git -C "${work}" config user.name "github-actions[bot]"
          git -C "${work}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${work}" add Formula/totsuka.rb
          if git -C "${work}" diff --cached --quiet; then
            echo "Formula already at ${TAG}; nothing to push."
            exit 0
          fi
          git -C "${work}" commit -m "totsuka ${version}"
          git -C "${work}" push
          rm -rf "${work}"
