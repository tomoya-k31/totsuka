name: release-please

on:
  push:
    branches: [main]

# Serialize runs instead of canceling: a canceled run mid-release (tag
# created, universal-binary upload pending) would strand a release. With
# cancel-in-progress off, a newer push waits as the single pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A fine-grained PAT (not the default GITHUB_TOKEN) so the Release PR
          # is created under a real identity and therefore triggers CI — the
          # required `lint` check then reports, and the PR merges without an
          # admin bypass. See docs/operations/release-runbook.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the version in Cargo.toml but never touches
  # Cargo.lock, so the lockfile is left one version behind on every release
  # (the next `cargo` run then regenerates it as an unrelated working-tree
  # diff). Sync it back into the open Release PR here so the merged release
  # commit already carries a consistent lockfile. Runs on every push while a
  # Release PR is open; if release-please force-pushed the branch (resetting
  # the lock), this re-syncs it.
  sync-lockfile:
    name: Sync Cargo.lock in the Release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the open Release PR branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # `// empty` maps a no-match (empty array → null) to an empty string;
          # without it gh prints the literal "null", defeating the -z guard.
          branch=$(gh pr list --state open --label "autorelease: pending" \
            --json headRefName --jq '.[0].headRefName // empty')
          if [ -z "$branch" ]; then
            # prs_created was true, so a missing Release PR is a real anomaly —
            # fail fast. sync-lockfile is not a release gate, so a red run here
            # doesn't block the tag; the next push retries.
            echo "No open Release PR found despite prs_created=true." >&2
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout the Release PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.pr.outputs.branch }}
          # PAT (not GITHUB_TOKEN) so the follow-up push triggers CI on the PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Sync workspace versions into Cargo.lock
        # `--workspace` re-resolves only the workspace members, so external
        # dependencies stay pinned; just the internal crate versions move.
        run: cargo update --workspace

      - name: Commit and push if Cargo.lock changed
        env:
          RELEASE_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync with the release version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock to the release version"
          git push origin "HEAD:${RELEASE_BRANCH}"

  # Build in the SAME workflow run: a Release published with the default
  # GITHUB_TOKEN does not trigger a separate `on: release` workflow, so the
  # universal-binary build is gated on release-please's `release_created`
  # output here instead.
  universal-binary:
    name: Build macOS universal binary
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (both macOS targets)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build both architectures
        # The sync-lockfile job keeps Cargo.lock in step with the release
        # version on the Release PR, so the merged release commit is already
        # consistent. --locked is still omitted defensively so a stray lock
        # drift regenerates rather than blocking the release build.
        run: |
          cargo build --release --bin totsuka --target x86_64-apple-darwin
          cargo build --release --bin totsuka --target aarch64-apple-darwin

      - name: Create universal binary with lipo
        run: |
          mkdir -p dist
          lipo -create -output dist/totsuka \
            target/x86_64-apple-darwin/release/totsuka \
            target/aarch64-apple-darwin/release/totsuka
          # Ad-hoc signature (v1): satisfies Gatekeeper after the user removes
          # the quarantine attribute. Developer ID signing / notarization is a
          # later step (see docs/operations/release-runbook.md).
          codesign --sign - --force dist/totsuka
          lipo -info dist/totsuka

      - name: Package the tarball
        run: |
          cp README.md LICENSE dist/
          tar -czf "totsuka-${TAG}-macos-universal.tar.gz" -C dist totsuka README.md LICENSE
          # Write only the raw SHA-256 (no filename) so release consumers can
          # verify the tarball without parsing the filename column.
          shasum -a 256 "totsuka-${TAG}-macos-universal.tar.gz" | awk '{print $1}' \
            | tee "totsuka-${TAG}-macos-universal.tar.gz.sha256"

      - name: Attach artifacts to the release
        run: |
          gh release upload "${TAG}" \
            "totsuka-${TAG}-macos-universal.tar.gz" \
            "totsuka-${TAG}-macos-universal.tar.gz.sha256" \
            --clobber
