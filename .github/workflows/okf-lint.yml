name: okf-lint

on:
  # path フィルタなし: main の required_status_checks が `lint` を必須にしているため、
  # ai-docs/ 以外だけを触る PR でも必ず1回は lint チェックが報告される必要がある
  # (フィルタで対象外になると、必須チェックが永久に "Expected" のまま PR が BLOCKED し続ける)。
  pull_request:
  push:
    branches: [main]
    paths:
      - "ai-docs/**"
      # 人間向け docs/ は ai-docs/ からの生成物なので、鮮度検査の対象になる
      - "docs/**"
      # 元帳のビルダー / lint 本体だけを触った変更でも main を検証する
      # (log.md と index.md は生成物になったので、生成側の回帰は ai-docs/ を
      #  1 バイトも変えずに入りうる)
      - "scripts/okf-*.sh"
      - "scripts/docs-freshness.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # リンク検査用（Rust製単一バイナリ）。キャッシュされるので2回目以降は数秒
      - name: Install lychee
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: lychee

      # frontmatter / type / index掲載漏れ / log形式 をエラー、リンク切れは警告。
      # リンク切れも落としたい場合は --strict を付ける。
      - name: Run okf-lint
        run: bash scripts/okf-lint.sh ai-docs

      # 人間向け docs/ が ai-docs/ の現在の内容から作られているかを検査する。
      # 検査するのは「古くないこと」だけで、内容の正しさは PR レビューが引き受ける
      # (ADR-0047)。このジョブ名 `lint` は必須チェックのコンテキストなので、
      # ここにステップとして足すことで ruleset を変えずに必須化される。
      - name: Check docs freshness
        run: bash scripts/docs-freshness.sh docs
