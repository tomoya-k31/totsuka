name: audit

# Advisory checks (RUSTSEC DB) change with time, not with PR content, so a
# daily cron catches new advisories faster than the old per-PR run did, while
# costing ~30 runs/month instead of ~380. PRs that can actually change the
# dependency graph (manifests, lockfile, deny policy) still get a run.
# Not a required status check, so the path filter cannot block a PR.

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST daily
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      # The Event Gateway is outside the workspace (#659), so `Cargo.lock`
      # without a `**/` prefix does not reach it — and that lockfile is what
      # ships inside a published container (#660). Named explicitly rather
      # than loosening the pattern, so the omission cannot come back.
      - "services/slack-event-gateway/Cargo.lock"
      - "deny.toml"
  workflow_dispatch:

# Least privilege: this workflow only checks out and runs the audit tools.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo-audit / cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-audit,cargo-deny
      - name: Run cargo-audit
        run: cargo audit
      - name: Run cargo-deny
        run: cargo deny check
      # The Event Gateway again: `cargo audit` resolves the lockfile from the
      # working directory, and the workspace's does not contain it. Skipping
      # this would mean **publishing a container built from a lockfile nothing
      # has ever scanned** — and the container is distroless, so its lockfile
      # is the only place a fix could land (#660).
      #
      # `cargo deny check` is not repeated here: `deny.toml` is the
      # workspace's policy file and does not apply to a separate crate. Adding
      # a second policy is a decision to take deliberately, not a line to
      # sneak into an audit job.
      - name: Run cargo-audit on the Event Gateway
        working-directory: services/slack-event-gateway
        run: cargo audit
