# cargo-nextest のローカル実行プロファイル（#459 / ADR-0049）。
#
# CI はこのファイルを読まない。CI のテストランナーは `cargo test` のままで、
# nextest はローカル実行だけを速くする（ADR-0018 §5 の不採用判断は 2 コアの CI
# ランナーでの実測に基づく CI 限定の結論なので、それを覆すものではない）。
#
# 使い方は scripts/dev-test.sh 経由を前提とする。

[profile.default]
# ローカルは PR 前のフルゲートとして回すので、1 件目で止めずに全部の失敗を
# 一度に出す。反復中に fail-fast したいときは `--fail-fast` を渡す。
fail-fast = false

# 60 秒を超えたテストを SLOW として報告するだけ。terminate-after は付けない
# ——待ちの長いテストを打ち切ると「遅いテスト」ではなく「失敗するテスト」に
# 化けて、原因が読めなくなるため。
slow-timeout = { period = "60s" }

# 成功したテストは 1 行も出さない（失敗だけ即座に見える）。ただし最終サマリには
# SLOW を残す——遅いテストを見つける手がかりを消さないように。
status-level = "fail"
final-status-level = "slow"
