# cargo-deny policy. See https://embarkstudios.github.io/cargo-deny/
# Vulnerability and license gates for the workspace (§9 quality gate).

[advisories]
version = 2
# Fail on any known vulnerability. Unmaintained/yanked crates surface as warnings.
yanked = "deny"

[licenses]
version = 2
# Permissive licenses acceptable for a MIT-licensed CLI. Extend as deps grow.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Warn (do not fail) on duplicate transitive versions for now.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
